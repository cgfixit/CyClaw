# CyClaw environment.yml
# Generated for conda CI + reproducible local dev
# Matches pyproject.toml + production invariants (Python 3.12, offline-first, hardened deps)
# Use: conda env create -f environment.yml && conda activate cyclaw

name: cyclaw

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  # pip is pinned (26.2.1, matches ci.yml's install-surface pin and the conda
  # lane's "Pin pip" step) instead of floating. A bare `pip` here lets the fresh
  # mamba env track conda-forge's newest pip while the actions/cache entry in
  # python-package-conda.yml restores an older env tree over it; the overlay can
  # mix pip/_internal modules from two pip versions and leave `python -m pip`
  # unimportable (ImportError: cannot import name 'get_runnable_pip', first seen
  # 2026-07-30; same failure signature reds the lane again when the two sides
  # drift). Pinning keeps the fresh env and any cached env byte-coherent, and
  # the cache key hashes this file, so bumping the pin also busts stale caches.
  # pip 26.2.1 confirmed on conda-forge (noarch) -- carries the fix for
  # PYSEC-2026-3721 (pip), matching the repo-wide pip-pin bump on the pip
  # install surfaces (ci.yml, pip-audit.yml, copilot-setup-steps.yml,
  # nemo-guardrails.yml, python-package-conda.yml, python-publish.yml).
  - pip=26.2.1
  # Core runtime — pinned to match pyproject.toml / constraints.txt exactly
  # (each version verified present on conda-forge, 2026-07). Keep these pins in
  # sync with pyproject.toml [project.dependencies] and constraints.txt; a bare
  # unpinned resolve here can silently drift from the pip path (e.g. numpy
  # floating to 2.x, which breaks chromadb/onnxruntime per CLAUDE.md).
  #
  - uvicorn=0.53.0
  - pydantic=2.13.5
  - pyyaml=6.0.3
  - httpx=0.28.1
  - langchain-core=1.6.3
  # Keep generated OTLP protos compatible with the native protobuf runtime.
  - opentelemetry-exporter-otlp-proto-grpc>=1.42
  - sentence-transformers=6.1.0
  # pytorch is sentence-transformers' hard transitive and is pinned explicitly
  # here for the same reason constraints.txt pins torch==2.13.0+cpu: post-
  # CVE-2025-32434 safety plus keeping the conda lane testing the same 2.13
  # line the pip path ships. Left unpinned, the solver floats conda-forge's
  # newest pytorch and the two install surfaces silently diverge. conda-forge
  # names the package `pytorch` (not `torch`) and has no `+cpu` local tag; the
  # `=cpu*` build glob forces the CPU-only builds (cpu_generic/cpu_mkl) over
  # the multi-GB cuda12x/cuda13x variants, mirroring the +cpu intent (the cuda
  # builds carry higher build numbers, so an unadorned version pin does NOT
  # guarantee a CPU resolve). pytorch 2.13.0 cpu builds confirmed present on
  # conda-forge for linux-64 py312 via the anaconda.org API, 2026-08-26; full
  # solve not run locally (no conda/mamba on the dev box) -- exercised by the
  # conda CI lane instead. dep-guard's D9 does not cross-check this pin against
  # the torch manifest pin (package name differs) -- bump it by hand whenever
  # constraints.txt's torch pin moves.
  - pytorch=2.13.0=cpu*
  # NOT pinning setuptools here, unlike constraints.txt's setuptools==84.0.0
  # (PYSEC-2026-3447 floor 83.0.0): every conda-forge pytorch=2.13.0 cpu build
  # hard-requires `setuptools <82` (confirmed via the conda-forge repodata,
  # 2026-09-21; reproduced live as a mamba solve failure -- "pytorch 2.13.0
  # would require setuptools <82" vs "setuptools =84.0.0 is not installable" --
  # in this CI lane when 84.0.0 was tried here). Pinning >=83 on this lane is
  # unsatisfiable without moving the pytorch pin, which is out of scope; left
  # to float here, same as before this file started tracking the pip-path gap.
  - huggingface_hub=1.32.0
  - numpy=1.26.4
  - nltk=3.10.3
  # PyPI package name is tzdata==2026.2 (requirements.txt / pyproject / constraints).
  # conda-forge splits this: `tzdata` is the OS IANA database (2025b / 2026c),
  # `python-tzdata` is the PEP 615 fallback wheel used by zoneinfo on hosts
  # without a system tzdb (Windows). Do not pin tzdata=2026.2 here — that
  # version does not exist on conda-forge and reds CyClaw Conda CI.
  - python-tzdata=2026.2
  # Test & Dev tooling — pinned to match pyproject.toml's test/dev extras
  - pytest=9.1.1
  # pytest>=8.2 requires pygments>=2.7.2 (same rationale as
  # requirements-test.txt / pyproject.toml's pygments==2.21.0 pin): an
  # unconstrained resolve can float the loose range down to a vulnerable
  # 2.9.0 (PYSEC-2023-117 / PYSEC-2026-2987). This conda lane pulled pytest
  # with no matching pygments pin of its own until now.
  - pygments=2.21.0
  - ruff=0.16.8
  - mypy=2.3.0
  - bandit=1.9.4
  - pytest-cov=7.1.0
  - pip:
      # conda-forge Chroma pins an older FastAPI. Install this trio from PyPI
      # so normal CyClaw package metadata and pip check agree on all platforms.
      - chromadb==1.5.9
      - fastapi==0.141.1
      - starlette==1.6.0
      - nemoguardrails==0.24.0
      - langgraph==1.2.11
      - rank-bm25==0.2.2
      - websockets==15.0.1
      # Telemetry-control floor from the pip path (pyproject.toml/constraints.txt).
      - onnxruntime==1.30.0
      # sqlite-vec (#1255 Phase C spike, test-only): no conda-forge package
      # exists (checked 2026-09-21 -- zero matches on noarch/linux-64
      # repodata), so it can only ride the pip: sublist here, same as the
      # packages above it.
      - sqlite-vec==0.1.9

# Optional: Create with mamba for speed
# mamba env create -f environment.yml

# After creation:
# conda activate cyclaw
# pip install -e ".[test,dev]" --no-deps  # register CyClaw with the dependencies installed above
# Additional extras need their dependencies installed; see setup-guide.md.
