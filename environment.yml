# CyClaw environment.yml
# Generated for conda CI + reproducible local dev
# Matches pyproject.toml + production invariants (Python 3.12, offline-first, hardened deps)
# Use: conda env create -f environment.yml && conda activate cyclaw

name: cyclaw

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  # Match ci.yml and conda-ci.yml's exact pip pin. The Conda workflow builds
  # a fresh environment; it no longer overlays a cached environment tree.
  # pip 26.2.2 vendors certifi 2026.10.19 (GHSA-6q48-6c7w-9gw2);
  # available from conda-forge noarch for Python 3.12.
  - pip=26.2.2
  # Core runtime — pinned to match pyproject.toml / constraints.txt exactly
  # (each version verified present on conda-forge, 2026-07). Keep these pins in
  # sync with pyproject.toml [project.dependencies] and constraints.txt; a bare
  # unpinned resolve here can silently drift from the pip path (e.g. numpy
  # floating to 2.x, which breaks chromadb/onnxruntime per CLAUDE.md).
  #
  - uvicorn=0.54.0
  - pydantic=2.13.5
  - pyyaml=6.0.3
  - httpx=0.28.1
  - langchain-core=1.6.12
  # Keep generated OTLP protos compatible with the native protobuf runtime.
  - opentelemetry-exporter-otlp-proto-grpc>=1.42
  # Security floors that constraints.txt pins exactly (PYSEC-2026-4320,
  # CVE-2026-114603). Both are conda-owned on this lane (httpx pulls certifi;
  # the exporter's opentelemetry-sdk pins its opentelemetry-api exactly), so a
  # pip: override would fight the conda solve. Floors, not exact pins: the
  # conda-forge build set was not checkable from the editing sandbox, and the
  # conda CI lane is what proves the solve.
  - certifi>=2026.10.19
  - opentelemetry-api>=1.45.1
  - sentence-transformers=6.1.0
  # Match pip's public torch release; CPU-only on Linux and Apple Silicon.
  # conda-forge's 2.14.1 py312 CPU builds allow setuptools >=77.0.3 on both
  # platforms (release metadata checked 2026-10-23), closing the old <82 cap.
  - pytorch=2.14.1=cpu*
  # Match constraints.txt; PYSEC-2026-3447 is fixed from 83.0.0.
  - setuptools=84.1.0
  - huggingface_hub=1.32.0
  - numpy=1.26.4
  - nltk=3.10.3
  # PyPI package name is tzdata==2026.5 (requirements.txt / pyproject / constraints).
  # conda-forge splits this: `tzdata` is the OS IANA database (2025b / 2026c),
  # `python-tzdata` is the PEP 615 fallback wheel used by zoneinfo on hosts
  # without a system tzdb (Windows). Do not pin tzdata=2026.2 here — that
  # version does not exist on conda-forge and reds CyClaw Conda CI.
  - python-tzdata=2026.2
  # Test & Dev tooling — pinned to match pyproject.toml's test/dev extras
  - pytest=9.1.1
  # pytest>=8.2 requires pygments>=2.7.2 (same rationale as
  # requirements-test.txt / pyproject.toml's pygments==2.21.0 pin): an
  # unconstrained resolve can float the loose range down to a vulnerable
  # 2.9.0 (PYSEC-2023-117 / PYSEC-2026-2987). This conda lane pulled pytest
  # with no matching pygments pin of its own until now.
  - pygments=2.21.0
  - ruff=0.17.1
  - mypy=2.4.0
  - bandit=1.9.4
  - pytest-cov=7.1.0
  - pip:
      # conda-forge Chroma pins an older FastAPI. Install this trio from PyPI
      # so normal CyClaw package metadata and pip check agree on all platforms.
      - chromadb==1.5.9
      - fastapi==0.143.3
      - starlette==1.8.0
      - nemoguardrails==0.24.1
      - langgraph==1.2.15
      - rank-bm25==0.2.2
      - websockets==15.0.1
      # Telemetry-control floor from the pip path (pyproject.toml/constraints.txt).
      - onnxruntime==1.31.0
      # Security floor from constraints.txt (CVE-2026-111063/-111064,
      # GHSA-2g87-pp6c-29x5). Only pip packages (nemoguardrails) pull aiohttp
      # here, so the exact pin rides this sublist and dep-guard D9 checks it.
      - aiohttp==3.14.5
      # sqlite-vec (#1255 Phase C spike, test-only): no conda-forge package
      # exists (checked 2026-09-21 -- zero matches on noarch/linux-64
      # repodata), so it can only ride the pip: sublist here, same as the
      # packages above it.
      - sqlite-vec==0.1.9

# Optional: Create with mamba for speed
# mamba env create -f environment.yml

# After creation:
# conda activate cyclaw
# pip install -e ".[test,dev]" --no-deps  # register CyClaw with the dependencies installed above
# Additional extras need their dependencies installed; see setup-guide.md.
