# Pinned Bandit SAST + SARIF.
# The legacy filename is part of GitHub's Bandit analysis key; retain it to
# preserve the existing code-scanning configuration. This does not run Defender.
#
# Replaces microsoft/security-devops-action: that CLI installs Guardian
# "Latest" and then pulls policy NuGet packages from
# msdoeu.pkgs.visualstudio.com as an anonymous identity. If that feed returns
# 403, Bandit never runs. CyClaw pins Bandit and its SARIF dependencies in a
# hash-verified lock file.
#
# Findings remain advisory. The job fails if Bandit cannot install, execute,
# or write SARIF. No id-token permission is granted, and no results are sent
# to Defender for Cloud.

name: "Bandit SAST (SARIF)"

'on':
  # Test the repository state whenever origin/main advances.
  push:
    branches: ["main"]

  # Test newly opened PRs targeting main and every subsequent revision.
  pull_request:
    branches: ["main"]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  schedule:
    - cron: '40 23 * * 0'

  workflow_dispatch:

# Keep the workflow default read-only. SARIF write access is scoped to the
# Bandit job so future jobs cannot silently inherit it.
permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  bandit:
    name: bandit (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            # Linux keeps the original `bandit` SARIF category so GitHub treats
            # it as the same analysis as before the matrix; a new name would
            # strand the existing alerts under a configuration nothing updates.
            sarif_category: bandit
            lock_file: locks/requirements-ci-bandit-lock-linux.txt

          - os: macos-latest
            label: macos
            sarif_category: bandit-macos
            # CyClaw does not currently generate a separately named macOS
            # Bandit lock. The Bandit/SARIF dependency set is platform-neutral,
            # and the existing lock contains hashes for the published PyYAML
            # artifacts required by macOS.
            lock_file: locks/requirements-ci-bandit-lock-linux.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.lock_file }}

      - name: Install Bandit
        shell: bash
        run: |
          # bandit[sarif] dependencies are included in the hashed lock.
          python -m pip install \
            --require-hashes \
            -r "${{ matrix.lock_file }}"

          python -c \
            "import bandit; assert bandit.__version__ == '1.9.4', bandit.__version__"

      - name: Run Bandit (advisory findings)
        shell: bash
        run: |
          # --exit-zero keeps findings advisory. test -s still fails this job
          # if Bandit exits before creating a non-empty SARIF document.
          bandit \
            -r \
            gate.py \
            gate_ops.py \
            gate_auth.py \
            gate_memory.py \
            graph.py \
            mcp_hybrid_server.py \
            retrieval \
            utils \
            llm \
            sync \
            agentic \
            guardrails \
            telegram \
            opentweet \
            memory \
            -f sarif \
            -o bandit.sarif \
            --exit-zero

          test -s bandit.sarif

      - name: Upload results to Security tab
        # Fork PRs receive a read-only token and cannot upload code-scanning
        # results. They still run the complete Bandit scan above.
        if: >-
          ${{
            !cancelled() &&
            hashFiles('bandit.sarif') != '' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: bandit.sarif
          category: ${{ matrix.sarif_category }}
