name: CyClaw Conda CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # security-events: write removed — CodeQL is owned by codeql.yml; no
  # duplicate scan here means this workflow needs no SARIF-upload permission.

# Same PyPI read budget as ci.yml, for the pip pin step and the --no-deps
# editable install. No conda-env or pip download cache is added here: the
# comment on the pip pin step records why an env overlay cache was removed.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  ci:
    # The Linux leg keeps its pre-matrix check name "ci (3.12)" so a required
    # status check on it is not orphaned by the new os axis.
    name: ${{ matrix.os == 'ubuntu-22.04' && format('ci ({0})', matrix.python-version) || format('ci ({0}, {1})', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is GitHub's Apple Silicon (arm64) runner, the same one
        # ci.yml's pip matrix uses. environment.yml's pytorch=2.14.1=cpu* glob
        # matches conda-forge's osx-arm64 cpu_generic builds (no CUDA variants
        # exist there), so one env file serves both legs.
        os: [ubuntu-22.04, macos-latest]
        python-version: ["3.12"]  # match sandbox 3.12 + modern invariants

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    # Env spec is repo-root environment.yml (NOT .github/workflows/environment.yml —
    # that path is a no-op placeholder after c708148; see that workflow's header).
    - name: Setup Miniconda + mamba (fast solver)
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
      with:
        # Pin the installer base (not "latest") so Miniforge itself is reproducible.
        # Matches the install-surface pin policy in ci.yml (pip==26.2.2).
        miniforge-version: "25.3.0-3"
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
        channel-priority: strict
        activate-environment: cyclaw
        environment-file: environment.yml
        auto-activate-base: false
        use-mamba: true

    # NO conda-env cache here, deliberately. One lived at this exact point --
    # AFTER setup-miniconda above has already solved and built the env from
    # environment.yml -- so a restore could never save solve or install time;
    # it could only overlay a previous run's site-packages onto a freshly
    # built env. That mechanism caused three incidents (2026-07-30 pip 26.2's
    # get_runnable_pip ImportError wedging every branch including main, since
    # restore-keys re-selected the poisoned blob on every re-run; then the -v3
    # blob going bad the same way on 2026-08-22), and each fix was a new cache
    # generation plus more healing code rather than removal. A cache that can
    # only ever hurt is not a cache. If conda-env caching is wanted later it
    # must be restored BEFORE setup-miniconda, keyed on environment.yml, with
    # setup-miniconda skipped on a hit -- a different design, not this one.
    - name: Pin pip in the conda env (matches ci.yml's exact pin)
      shell: bash -leo pipefail {0}
      run: |
        # Plain pin: with the overlay cache gone (see above) the env's pip is
        # always the coherent one mamba just installed, so the former
        # wipe-site-packages + ensurepip bootstrap -- which existed solely to
        # heal a cache-restored, half-upgraded pip -- has nothing left to heal.
        python -m pip install --upgrade "pip==26.2.2"
        python -m pip --version

    - name: Install CyClaw in editable mode + test extras
      shell: bash -leo pipefail {0}
      run: |
        python -m pip install -e ".[test,dev]" --no-deps
        python -m pip check
        python -m guardrails.verify_install

    - name: Prepare hermetic test env
      shell: bash -leo pipefail {0}
      run: |
        mkdir -p data/personality index logs
        # Create a stub only when the tracked soul is absent; sandbox scripts
        # must back up and restore the real content when it exists.
        [ -f data/personality/soul.md ] || printf '# Soul\n' > data/personality/soul.md
        #
        # note:
        # dont get it twisted and think this is an invite to delete anyones soul. its not. if it happens again copilot gets turned off and ill prep this env a different way.
        #
        echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"

    - name: Cache embeddings model (sentence-transformers)
      # See ci.yml's identical step for the full rationale: this job's
      # verify.sh (CyClaw-Sandbox) Stage 3 builds a real index via
      # retrieval.indexer, which fetches models.embeddings.model from
      # HuggingFace into .emb_cache on first use, and its graph checks fetch
      # models.reranker.model into the same directory. Caching it here removes
      # that repeat network fetch on every run.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: .emb_cache
        # Model-identity key, not hashFiles('config.yaml') -- see the rationale
        # on ci.yml's identical step.
        key: emb-model-all-MiniLM-L6-v2+ms-marco-MiniLM-L6-v2-v1
        restore-keys: |
          emb-model-

    - name: Pytest — unit + integration + safe smoke (RAG/policy focused)
      shell: bash -leo pipefail {0}
      run: |
        # Coverage targets: one per [tool.coverage.run] source entry, same order
        # and same set as ci.yml's "Run tests + coverage" step -- rationale, and
        # the editing caveats, are documented there.
        # tests/test_ci_coverage_flag_contract.py asserts this set equals the
        # pyproject source list exactly, in both lanes, so the two cannot drift.
        pytest tests/ \
          -v \
          --cov=gate \
          --cov=gate_ops \
          --cov=gate_auth \
          --cov=gate_memory \
          --cov=graph \
          --cov=mcp_hybrid_server \
          --cov=metrics \
          --cov=llm \
          --cov=retrieval \
          --cov=utils \
          --cov=sync \
          --cov=guardrails \
          --cov=telegram \
          --cov=opentweet \
          --cov=memory \
          --cov=schemas \
          --cov-report=xml \
          --cov-report=term-missing \
          --tb=short

    # CyClaw-Sandbox's verify.sh is a full app-runtime e2e smoke (it builds
    # the index and launches the uvicorn server), not a lightweight self-test
    # -- the same shape .github/workflows/ci.yml's verify-skills matrix runs,
    # and that job is deliberately continue-on-error for the identical reason
    # stated there: it can be flaky on shared runners, and the authoritative
    # pass/fail gate for this job is the pytest coverage step above, not this
    # e2e smoke. There is no repo-root verify.sh; this step is the one that
    # exists, and it stays advisory.
    - name: Run sandbox verification harness (if present, non-blocking)
      shell: bash -leo pipefail {0}
      continue-on-error: true
      run: |
        if [ -f .claude/skills/CyClaw-Sandbox/verify.sh ]; then
          echo "Running sandbox verification harness..."
          bash .claude/skills/CyClaw-Sandbox/verify.sh
        fi

    # CodeQL analysis is owned by .github/workflows/codeql.yml which runs on
    # every push/PR to main. A duplicate scan here would double billing and
    # upload a conflicting SARIF result to the same security tab. Removed.
