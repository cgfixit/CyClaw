# The pinned Numbat CLI 0.2.0 (schema 0.3.0) against CyClaw's Numbat stream.
#
#   numbat-rules-fixture (blocking): committed hand-written fixtures plus a
#     live executor-jail run. It was advisory (continue-on-error, #961 / #965)
#     while that contract was new. The job itself succeeded on the last 30
#     main runs through 3552d790 (workflow run 36416247349 and the 29 before
#     it), so a failure now turns this workflow red. A GitHub release outage
#     for the pinned numbat 0.2.0 tarball still fails the job; that is the
#     residual risk. Whether the check is required to merge stays a ruleset
#     setting, which this file cannot set.
#   numbat-stream-contract (blocking; issue #1458 Phases 1 and 4): representative
#     events from each producer family, written by CyClaw's real emitter code
#     from inputs modeled on its callers (tests/numbat_shaped_events.py:
#     mainline audit projection, pre-action hook verdicts, CEL monitor, ops /
#     fsconnect / sqlconnect action plane), must load in the pinned CLI with
#     zero findings; CyClaw-shaped exfil and secret-read events must still fire
#     the rules that catch them; and every event must validate against the
#     schema-0.3.0 JSON contract shipped inside the same pinned release. The
#     pre-action hook's numbat engine (utils/numbat_gate.py) then decides real
#     calls against the example rules in tests/fixtures/numbat/gate-rules,
#     whose companion tests `numbat rules check` runs first.
#   numbat-cel (blocking; issue #1458 Phase 3): tests/test_numbat_cel.py with
#     cel-python installed. Of the unit lanes, only ci.yml's Linux leg
#     installs it (and runs tests/test_gate.py's /query test, which needs the
#     app install this lane skips); its evaluator tests skip on the other
#     legs. CYCLAW_REQUIRE_CELPY=1 turns a missing evaluator into a failure
#     here and in that Linux step instead of a skip.
#
# "Blocking" means no continue-on-error: a failure turns this workflow red.
# Whether a check is REQUIRED to merge is a GitHub ruleset setting, not
# something this file can set. No live LLM, no full pytest, no installer here,
# and this file does not edit ci.yml.
name: Numbat rules fixture

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".claude/**"

concurrency:
  group: numbat-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

# pip's 15s / 5-retry default exhausted on /simple/jsonschema/ in this
# workflow's stream-contract job (run 36402013039, attempt 1) even after a
# prefix pip-cache restore that did not contain jsonschema. Same pair as
# ci.yml: wider socket timeout and more retries only. The setup-python
# cache: pip blocks below are unchanged. A dead index still fails the job.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  numbat-rules-fixture:
    name: numbat rules test --fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install numbat 0.2.0 (linux amd64)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/numbat.tgz \
            https://github.com/perplexityai/numbat/releases/download/v0.2.0/numbat_0.2.0_linux_amd64.tar.gz
          echo "6513d8cec69ea4a55667b0a764b93b7cef8fe814c2ef9e2535aaf438f11f1548  /tmp/numbat.tgz" | sha256sum -c -
          tar -xzf /tmp/numbat.tgz -C /tmp
          sudo install -m 0755 /tmp/numbat /usr/local/bin/numbat
          numbat version

      - name: Known-bad fixture must hit required rules
        run: |
          numbat rules test \
            --fixture tests/fixtures/numbat/known-bad-events.ndjson \
            --expect exfil.curl_post_file \
            --expect secrets.read_private_key

      - name: Clean / jail fixture must produce zero hits
        run: |
          numbat rules test \
            --fixture tests/fixtures/numbat/clean-events.ndjson \
            --expect-none

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          # pytest/pyyaml have no manifest pin (installed ad hoc below), so
          # key the cache on the workflow file itself -- same pattern
          # ci.yml and semgrep.yml already use for the identical situation.
          cache-dependency-path: .github/workflows/numbat-rules.yml

      - name: Live executor-jail events must produce zero hits
        env:
          NUMBAT: /usr/local/bin/numbat
          GROK_API_KEY: dummy
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          # --noconftest: tests/conftest.py imports retrieval.hybrid_search
          # (rank_bm25 / torch). This job only installs pytest+pyyaml.
          python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3
          python -m pytest --noconftest \
            tests/test_numbat_rules_fixtures.py::test_executor_jail_live_events_have_zero_rule_hits \
            -q --tb=short

  numbat-stream-contract:
    name: CyClaw-shaped stream vs numbat 0.2.0 + schema 0.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install numbat 0.2.0 (linux amd64) and its schema-0.3.0 contract
        run: |
          set -euo pipefail
          # The schema files ship in the same checksummed release archive as
          # the binary, so the JSON contract can never drift from the CLI.
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/numbat.tgz \
            https://github.com/perplexityai/numbat/releases/download/v0.2.0/numbat_0.2.0_linux_amd64.tar.gz
          echo "6513d8cec69ea4a55667b0a764b93b7cef8fe814c2ef9e2535aaf438f11f1548  /tmp/numbat.tgz" | sha256sum -c -
          mkdir -p /tmp/numbat
          tar -xzf /tmp/numbat.tgz -C /tmp/numbat
          sudo install -m 0755 /tmp/numbat/numbat /usr/local/bin/numbat
          numbat version | grep -Fx "numbat 0.2.0 (schema 0.3.0)"
          test -f /tmp/numbat/docs/schema/v0.3.0/event-record.schema.json

      - name: Committed CyClaw-shaped fixtures score as expected
        run: |
          numbat rules test \
            --fixture tests/fixtures/numbat/cyclaw-shaped-events.ndjson \
            --expect-none
          numbat rules test \
            --fixture tests/fixtures/numbat/cyclaw-shaped-known-bad.ndjson \
            --expect exfil.curl_post_file \
            --expect secrets.read_private_key

      - name: Example pre-action gate rules pass their companion tests
        run: numbat rules check --no-builtin-rules --rules-dir tests/fixtures/numbat/gate-rules

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          # Same ad hoc tool pins as the job above, so the same cache key.
          cache-dependency-path: .github/workflows/numbat-rules.yml

      - name: Live producers and the pre-action gate vs the pinned CLI and schema
        env:
          NUMBAT: /usr/local/bin/numbat
          NUMBAT_SCHEMA_DIR: /tmp/numbat/docs/schema/v0.3.0
          CYCLAW_REQUIRE_NUMBAT: "1"
          GROK_API_KEY: dummy
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          # jsonschema validates the published Draft 2020-12 contract, which
          # also covers what `rules test` accepts without checking (unknown
          # top-level keys, missing required fields, the endpoint object).
          # --noconftest for the same reason as the job above.
          python -m pip install --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.3 jsonschema==4.26.0
          python -m pytest --noconftest tests/test_numbat_cyclaw_shaped.py tests/test_numbat_gate.py \
            -q --tb=short -o addopts=""

  numbat-cel:
    name: CEL monitor with cel-python installed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          # The hashed numbat lock is the install. The workflow file still
          # names the job, so it stays in the cache key.
          cache-dependency-path: |
            .github/workflows/numbat-rules.yml
            locks/requirements-ci-numbat-lock-linux.txt

      - name: Install the numbat-cel extra's pin
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r locks/requirements-ci-numbat-lock-linux.txt

      - name: CEL monitor tests must run, not skip
        env:
          CYCLAW_REQUIRE_CELPY: "1"
          GROK_API_KEY: dummy
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest --noconftest tests/test_numbat_cel.py -q --tb=short -o addopts="" -rs
