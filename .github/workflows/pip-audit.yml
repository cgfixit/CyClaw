name: pip-audit (Python dependency CVE scan + Install Verification Gate)

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    paths:
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'constraints.txt'
      # pyproject.toml declares every optional extra (postgres, pgvector,
      # agentic-deepagents, agentic-deepagents-cloud, dev,
      # test). Without it here, adding or bumping an optional dependency
      # changed no triggering path and this workflow never ran on the change.
      - 'pyproject.toml'
      - 'locks/requirements-lock-*.txt'
      - 'locks/requirements-*-lock-*.txt'
      - 'scripts/ci-lock-inputs/**'
      - '.github/workflows/pip-audit.yml'
      - 'guardrails/**'
      - 'config.yaml'
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'constraints.txt'
      - 'pyproject.toml'
      - 'locks/requirements-lock-*.txt'
      - 'locks/requirements-*-lock-*.txt'
      - 'scripts/ci-lock-inputs/**'
      - '.github/workflows/pip-audit.yml'
      - 'guardrails/**'
      - 'config.yaml'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded in-progress runs on the same branch to save CI minutes;
# pushes to main are exempt so main keeps a complete scan history.
concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Same PyPI read budget as ci.yml. Applies inside the audit venvs too.
# Does not change pins, ignore-vuln lists, or the install commands.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  verify-install:
    name: verify-install (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        profile: [requirements, editable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          # Matches ci.yml's convention. This job's own triggers already fire on
          # every requirements.txt/constraints.txt change, so the pip cache still
          # busts every run that matters — but restores unrelated-transitive
          # wheels from a previous run instead of a cold cache.
          cache-dependency-path: |
            requirements.txt
            locks/requirements-lock-linux.txt
            locks/requirements-lock-macos.txt
            locks/requirements-lock-windows.txt
            locks/requirements-torch-lock-linux.txt
            locks/requirements-torch-lock-macos.txt
            locks/requirements-torch-lock-windows.txt
            requirements-test.txt
            constraints.txt
            pyproject.toml

      - name: Upgrade pip (CVE mitigation)
        shell: bash
        # Exact pin per ci.yml header policy (==26.2.1, not floating >=) — keeps
        # CI reproducible instead of silently picking up whatever pip ships next.
        run: python -m pip install --upgrade "pip==26.2.1"

      - name: Cache torch CPU wheel
        if: runner.os != 'macOS'
        # Mirrors ci.yml's dedicated torch cache: torch (~2GB) is pinned
        # infrequently, so keying its wheel separately means this job's own
        # requirements.txt/constraints.txt triggers don't force a re-download of
        # the heaviest dependency on every run. macOS skips this cache entirely
        # -- see the macOS-specific install step below (same split ci.yml uses).
        # The torch==2.13.0+cpu pin (and this cache key) is duplicated in
        # ci.yml and copilot-setup-steps.yml -- grep for the version string
        # under .github/workflows/ before bumping it here. (devskim.yml was
        # listed too until it dropped its install entirely; it now has no torch
        # pin, so that cross-reference would send a future bump on a dead end.)
        id: torch-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .torch-wheels
          key: torch-cpu-2.13.0-${{ runner.os }}-py312
          restore-keys: |
            torch-cpu-2.13.0-${{ runner.os }}-

      - name: Download torch wheel (cache miss only)
        if: runner.os != 'macOS' && steps.torch-wheel-cache.outputs.cache-hit != 'true'
        shell: bash
        # torch is pinned in requirements.txt as the CPU build; fetch the lean
        # wheel from the PyTorch index (matching ci.yml and the documented
        # CVE-2025-32434 >=2.6.0 floor); --no-deps avoids pulling the default CUDA build.
        run: |
          pip download "torch==2.13.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps -d .torch-wheels

      - name: Install the hashed runtime lock
        env:
          INSTALL_PROFILE: ${{ matrix.profile }}
        if: runner.os != 'macOS'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) torch_lock=locks/requirements-torch-lock-linux.txt; runtime_lock=locks/requirements-lock-linux.txt ;;
            Windows) torch_lock=locks/requirements-torch-lock-windows.txt; runtime_lock=locks/requirements-lock-windows.txt ;;
          esac
          pip install --no-index --no-deps --require-hashes --find-links .torch-wheels -r "$torch_lock"
          pip install --require-hashes -r "$runtime_lock"
          if [ "$INSTALL_PROFILE" != requirements ]; then
            pip install -e . --no-deps
          fi

      - name: Install the hashed runtime lock (macOS -- plain torch, no +cpu suffix)
        env:
          INSTALL_PROFILE: ${{ matrix.profile }}
        if: runner.os == 'macOS'
        shell: bash
        # torch==2.13.0+cpu 404s on https://download.pytorch.org/whl/cpu for
        # macOS -- that index lists plain (non "+cpu"-suffixed) versions there
        # instead, because Apple Silicon has no separate CPU/CUDA build to
        # disambiguate. The macOS locks already omit the +cpu suffix.
        run: |
          pip install --require-hashes --no-deps -r locks/requirements-torch-lock-macos.txt
          pip install --require-hashes -r locks/requirements-lock-macos.txt
          if [ "$INSTALL_PROFILE" != requirements ]; then
            pip install -e . --no-deps
          fi

      - name: Verify dependency consistency + smoke imports
        shell: bash
        run: |
          python -m pip check
          echo 'GROK_API_KEY=dummy' >> "$GITHUB_ENV"
          python -c "import chromadb, langgraph, fastapi; print('Core imports OK')"
          python -m guardrails.verify_install

  scan:
    needs: verify-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          # pip-audit is pinned in this file's install step below, so the
          # workflow file is the right key -- the same convention the sibling
          # verify-install job and semgrep.yml already use for workflow-only
          # tool installs. Zero coverage tradeoff: this caches the SCANNER
          # download only, never the dependency set being audited (pip-audit
          # resolves that itself, from the manifests, on every run).
          cache-dependency-path: .github/workflows/pip-audit.yml

      - name: Install pip-audit (CI scanner only)
        # Pinned exactly (both jobs in this file), matching this repo's
        # convention for workflow-only scanner tools -- an unpinned install can
        # resolve a different version per job/run, making one job's vuln DB
        # silently out of step with the other's for the same commit.
        run: pip install pip-audit==2.10.1

      - name: Install audited environment (hashed runtime lock + hashed test lock)
        shell: bash
        # pip-audit's own `-r` resolves dependencies itself, in a throwaway venv
        # it builds internally -- it has no `-c`/`--constraint` flag, so it can
        # never see constraints.txt (confirmed: pip-audit==2.10.1 --help lists no
        # such option, and passing -c errors "argument project_path: not allowed
        # with argument -r/--requirement"). A real `pip install`, run here into
        # an isolated venv, DOES support -c -- same command verify-install
        # already runs above. Isolated so pip-audit's own tool dependencies
        # (rich, cyclonedx, pip-requirements-parser, ...) never enter the
        # audited set below.
        #
        # pip itself is pinned to 26.2.1 -- same exact version as every other
        # workflow in this repo (dep-guard/verify-deps E1 requires one
        # consistent pip pin across all workflows; a divergent pin here would
        # break that check). pip ends up IN the audited site-packages below
        # (it's just another installed package once real `pip install` is
        # used instead of pip-audit's own internal resolution); 26.2.1 carries
        # the fix for PYSEC-2026-3721, so no ignore is needed for it below
        # (was ignored at 26.1.2 -- see the repo-wide pin bump that closed it).
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install --upgrade pip==26.2.1
          "$RUNNER_TEMP/audit-venv/bin/pip" install --require-hashes --no-deps \
            -r locks/requirements-torch-lock-linux.txt --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/audit-venv/bin/pip" install --require-hashes -r locks/requirements-lock-linux.txt
          "$RUNNER_TEMP/audit-venv/bin/pip" install --require-hashes -r locks/requirements-test-lock-linux.txt

      - name: Run pip-audit (ignore only mitigated chromadb + nltk CVEs)
        run: |
          AUDIT_PATH="$("$RUNNER_TEMP/audit-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          pip-audit --path "$AUDIT_PATH" --ignore-vuln CVE-2026-45829 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833 --ignore-vuln PYSEC-2026-3740
        # CVE-2026-45829 (Critical pre-auth RCE) — risk accepted under v1.4.0 invariants.
        # Actual controls:
        #   - chromadb.PersistentClient (local embedded mode, path from config.yaml["indexing"]["chroma_path"])
        #   - No HttpClient / no network-exposed /api/v2 server surface
        #   - Pre-computed embeddings via sentence-transformers (no dynamic embedding functions or trust_remote_code paths)
        #   - Offline-first design + full telemetry kill switch in gate.py
        #   - Reproducible install gate (verify-install matrix on Ubuntu/Windows/macOS + Python 3.12)
        # Cross-ref: cyclaw-privacy §K / §M, hybrid_search.py:55, indexer.py:58, gate.py:TELEMETRY_KILL
        # Track upstream for patched 1.5.x release; re-evaluate on bump.
        #
        # CVE-2026-45830 / CVE-2026-45831 / CVE-2026-45833 — same HTTP-server
        # surface as CVE-2026-45829; added 2026-08-26 after pip-audit on main
        # went red on 2026-08-25 (runs 32815649971, 32861024390) when the
        # advisory DB started reporting them against chromadb 1.5.9. None have
        # a fixed version as of that date.
        #   - CVE-2026-45830 (GHSA-2wm9-hf6c-p5cr): authenticated IDOR on the
        #     FastAPI /api/v2 collections surface — any authenticated HTTP
        #     user can read/write/update/delete any collection.
        #   - CVE-2026-45831: SimpleRBACAuthorizationProvider evaluates
        #     permissions without verifying tenant/database/collection scope.
        #   - CVE-2026-45833: authenticated code injection via embedding-
        #     function config for a caller with UPDATE_COLLECTION (the
        #     post-auth sibling of 45829's pre-auth RCE).
        # CyClaw never runs the Chroma HTTP server, never enables SimpleRBAC,
        # and never exposes /api/v2; it uses chromadb.PersistentClient in
        # embedded mode only. Same acceptance as CVE-2026-45829. Re-evaluate
        # if a future change introduces HttpClient or a chroma server process.
        #
        # PYSEC-2026-597 (nltk) — risk accepted, 2026-07. nltk bumped 3.9.4->3.10.0
        # on main (dependabot) 2026-07-17; not confirmed here whether 3.10.0 itself
        # carries a fix (osv.dev is unreachable from this sandbox to check) -- the
        # ignore is kept regardless since it's still fully mitigated below.
        # CyClaw's only nltk usage is
        # `from nltk.stem import PorterStemmer` (retrieval/stemmer.py); it never
        # calls nltk.download() or nltk.data.load() -- the known nltk vulnerability
        # classes (downloader zip-slip RCE, punkt/corpus-reader path traversal) all
        # live in code this repo never executes. stemmer.py's own header comment
        # already documents this: "the NLTK URL-encoded path-traversal CVE (punkt
        # tokenizer) is not reachable." Re-evaluate when a patched release ships.
        #
        # PYSEC-2026-3740 (nltk, alias CVE-2026-81726 / GHSA-8mgp-746c-j5xp) —
        # added 2026-09-04 after pip-audit on main went red on 2026-09-03
        # (run 33722097917) and again on #1306 (runs 33828980264, 33829017851).
        # pip-audit prints this PYSEC id with no Fix Versions against nltk 3.10.3
        # (current latest). The advisory is a pathsec bypass in unused
        # model-artifact APIs (TransitionParser.train/parse,
        # AveragedPerceptron.save/load, PerceptronTagger.save_to_json,
        # save_maxent_params). CyClaw still only imports PorterStemmer.
        # Drop this ignore on the next nltk release that patches it.
        #
        # (This step audits requirements.txt + requirements-test.txt against
        # constraints.txt, which together cover base runtime + test tools and
        # carry ZERO extras. Every optional dependency is audited by the
        # scan-optional job below.)
        #
        # setuptools is pinned at 84.0.0 in constraints.txt (PYSEC-2026-3447
        # floor is 83.0.0). The previous --ignore-vuln is gone: the audited
        # venv installs locks/requirements-lock-linux.txt with --require-hashes, and
        # that lock carries setuptools==84.0.0.
        #
        # PYSEC-2026-3721 (pip) — was ignored here from 2026-09-07 while pip
        # was pinned to 26.1.2 repo-wide. Closed by the repository-wide pip
        # pin bump to 26.2.1 (ci.yml, copilot-setup-steps.yml,
        # nemo-guardrails.yml, python-package-conda.yml, python-publish.yml,
        # environment.yml) rather than a standing ignore -- pip is a
        # CI/build-time tool here, never a shipped runtime dependency of
        # CyClaw, but the fixed version was already available and the
        # coordinated bump was small.

  scan-optional:
    # Why this job exists: requirements.txt + requirements-test.txt (what the
    # `scan` job above audits) carry base runtime + test tools and NOTHING else
    # -- that is the declared scope contract, enforced by
    # .claude/skills/verify-deps/check_env_drift.py check E4. Every optional
    # capability therefore had zero CVE coverage:
    # The deepagents agentic-coding stack, the Grok and Claude
    # cloud SDKs, and the Postgres/pgvector backends. This job closes that.
    #
    # Deliberately NOT merged into the `scan` job: the extras are opt-in and
    # deepagents pulls a large transitive tree, so keeping
    # them separate means a resolution problem in an optional stack cannot mask
    # or block the base-runtime audit that actually gates every install.
    name: scan-optional (extras CVE scan)
    needs: verify-install
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          # pip-audit is pinned in this file's install step below, so the
          # workflow file is the right key -- the same convention the sibling
          # verify-install job and semgrep.yml already use for workflow-only
          # tool installs. Zero coverage tradeoff: this caches the SCANNER
          # download only, never the dependency set being audited (pip-audit
          # resolves that itself, from the manifests, on every run).
          cache-dependency-path: .github/workflows/pip-audit.yml

      - name: Install pip-audit (CI scanner only)
        # Pinned exactly (both jobs in this file), matching this repo's
        # convention for workflow-only scanner tools -- an unpinned install can
        # resolve a different version per job/run, making one job's vuln DB
        # silently out of step with the other's for the same commit.
        run: pip install pip-audit==2.10.1

      - name: Resolve the hashed lock for each extra
        shell: bash
        # Names still come from pyproject.toml, so a new extra fails this job
        # until scripts/refresh-ci-locks.sh grows a lock. Aggregate extras
        # (`full`, `all`) stay skipped. test and numbat-cel reuse the locks
        # the other jobs already install.
        run: |
          mkdir -p .audit-extras
          python - <<'PY'
          import pathlib, sys, tomllib
          def pin(req: str):
              body = req.split(";", 1)[0].strip()
              name, sep, rest = body.partition("==")
              if sep != "==":
                  return None
              dist = name.split("[", 1)[0].strip().lower().replace("_", "-")
              version = rest.split(",", 1)[0].split()[0].strip().rstrip("\\")
              if not dist or not version:
                  return None
              return dist, version

          def locked_pins(path: pathlib.Path):
              found = set()
              for line in path.read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or stripped.startswith("--"):
                      continue
                  parsed = pin(stripped)
                  if parsed:
                      found.add(parsed)
              return found

          extras = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["optional-dependencies"]
          rows = []
          missing = []
          stale = []
          for name, reqs in extras.items():
              direct = [r for r in reqs if not str(r).startswith("cyclaw[")]
              if not direct:
                  print(f"skip {name} (aggregate extra, no direct pins)")
                  continue
              if name == "test":
                  lock = "locks/requirements-test-lock-linux.txt"
              elif name == "numbat-cel":
                  lock = "locks/requirements-ci-cel-lock-linux.txt"
              else:
                  lock = f"locks/requirements-extra-lock-{name}-linux.txt"
              lock_path = pathlib.Path(lock)
              if not lock_path.is_file():
                  missing.append(f"{name} -> {lock}")
                  continue
              pins = locked_pins(lock_path)
              for req in direct:
                  parsed = pin(str(req))
                  if parsed is None or parsed not in pins:
                      stale.append(f"{name} {req} -> {lock}")
              rows.append(f"{name}\t{lock}")
              print(f"{name} {lock}")
          if missing:
              sys.exit("missing hashed extra lock: " + ", ".join(missing))
          if stale:
              sys.exit("extra pin missing from its hashed lock: " + ", ".join(stale))
          pathlib.Path(".audit-extras/locks.tsv").write_text("\n".join(rows) + "\n")
          PY

      - name: Run pip-audit over every extra
        shell: bash
        # Loops instead of failing on the first extra so one vulnerable stack
        # does not hide findings in the others -- the whole point is a complete
        # picture per run. `failed` accumulates and the step exits non-zero at
        # the end if any extra had findings.
        #
        # Every CVE is a real finding here -- the base scan's chromadb/nltk
        # ignores are deliberately NOT carried over, since neither package is
        # an extra. Each extra installs from a hashed lock compiled against
        # constraints.txt (setuptools stays 84.0.0 when a package pulls it,
        # PYSEC-2026-3447 floor 83.0.0). pip-audit -r has no -c/--constraint
        # flag, so the lock is installed into a throwaway venv and audited
        # with --path. pip is
        # pinned to 26.2.1 (matching every other workflow -- dep-guard's E1
        # cross-workflow pin-consistency check), which carries the fix for
        # PYSEC-2026-3721, so no ignore is needed for it below (was ignored
        # at 26.1.2 -- see the base `scan` job's comment for the pin-bump
        # history).
        run: |
          failed=""
          while IFS=$'\t' read -r extra lock; do
            echo "::group::pip-audit $extra"
            ok=0
            for attempt in 1 2 3; do
              rm -rf "$RUNNER_TEMP/audit-venv-extra"
              python -m venv "$RUNNER_TEMP/audit-venv-extra"
              "$RUNNER_TEMP/audit-venv-extra/bin/python" -m pip install --upgrade pip==26.2.1
              if "$RUNNER_TEMP/audit-venv-extra/bin/pip" install --require-hashes -r "$lock"; then
                AUDIT_PATH="$("$RUNNER_TEMP/audit-venv-extra/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
                if pip-audit --path "$AUDIT_PATH"; then
                  ok=1
                  break
                fi
              fi
              echo "pip-audit attempt $attempt failed for $extra; retrying..."
              sleep 5
            done
            if [ "$ok" -eq 1 ]; then
              echo "OK: $extra"
            else
              echo "FINDINGS: $extra"
              failed="$failed $extra"
            fi
            echo "::endgroup::"
          done < .audit-extras/locks.tsv
          if [ -n "$failed" ]; then
            echo "::error::pip-audit reported findings in optional extra(s):$failed"
            exit 1
          fi
          echo "All optional extras clean."
