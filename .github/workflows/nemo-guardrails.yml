# Real NeMo 0.24 and Numbat gateway acceptance (issues #1134 and #1486).
# Isolated from ci.yml so later engine-hygiene PRs do not restack this file.
# Default pytest on the main test job must keep skipping these tests.

name: NeMo Guardrails runtime (0.24)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    # No base-branch filter: stacked PRs (e.g. #1137 onto P1) must still get
    # the 0.24 construct proof. Filtering to main-only skipped those PRs.
    paths-ignore:
      - "docs/**"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Same PyPI read budget as ci.yml. The guardrails install and its pins are unchanged.
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  nemo-runtime:
    name: nemoguardrails 0.24 actions + gateway HTTP acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CYCLAW_NEMO_RUNTIME: "1"
      CYCLAW_REQUIRE_NUMBAT: "1"
      CYCLAW_REQUIRE_CELPY: "1"
      NUMBAT: /usr/local/bin/numbat
      GROK_API_KEY: dummy
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      NEMO_GUARDRAILS_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      ANONYMIZED_TELEMETRY: "False"
      OTEL_SDK_DISABLED: "true"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING_V2: "false"
      LANGCHAIN_TRACING: "false"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install pinned Numbat 0.2.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/numbat.tgz \
            https://github.com/perplexityai/numbat/releases/download/v0.2.0/numbat_0.2.0_linux_amd64.tar.gz
          echo "6513d8cec69ea4a55667b0a764b93b7cef8fe814c2ef9e2535aaf438f11f1548  /tmp/numbat.tgz" | sha256sum -c -
          mkdir -p /tmp/cyclaw-numbat
          tar -xzf /tmp/numbat.tgz -C /tmp/cyclaw-numbat
          sudo install -m 0755 /tmp/cyclaw-numbat/numbat /usr/local/bin/numbat
          test "$(numbat version)" = "numbat 0.2.0 (schema 0.3.0)"

      - name: Cache torch CPU wheel
        # Same pin/index as ci.yml. constraints.txt names torch==2.13.0+cpu,
        # which is not on PyPI — pip install -e ".[numbat-cel,test]" -c
        # constraints.txt fails ResolutionImpossible without this wheel first
        # (run 33070991796).
        id: torch-wheel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .torch-wheels
          key: torch-cpu-2.13.0-${{ runner.os }}-py312
          restore-keys: |
            torch-cpu-2.13.0-${{ runner.os }}-

      - name: Download torch wheel (cache miss only)
        if: steps.torch-wheel-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          pip download "torch==2.13.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu \
            --no-deps -d .torch-wheels

      - name: Install torch CPU then cyclaw[numbat-cel,test]
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          pip install --no-index --no-deps --require-hashes --find-links .torch-wheels \
            -r requirements-torch-lock-linux.txt
          pip install --require-hashes -r requirements-lock-linux.txt
          pip install --require-hashes -r requirements-test-lock-linux.txt
          pip install --require-hashes -r requirements-ci-cel-lock-linux.txt
          pip install -e ".[numbat-cel,test]" --no-deps
          pip check
          python -m guardrails.verify_install
          python -c "from importlib.metadata import version; assert version('cel-python') == '0.5.0'"

      - name: Real NeMo and Numbat gateway HTTP acceptance (loopback only)
        run: |
          python -m pytest tests/nemo_runtime -q --tb=short

      - name: Advisory generation-call inventory
        continue-on-error: true
        run: python -m guardrails.call_inventory
