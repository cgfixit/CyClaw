name: Codex Skills

on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".codex/**"
      - "AGENTS.md"
      - "scripts/check_codex_skills.py"
      - "locks/requirements-ci-yaml-lock-linux.txt"
      - ".github/workflows/codex-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".codex/**"
      - "AGENTS.md"
      - "scripts/check_codex_skills.py"
      - "locks/requirements-ci-yaml-lock-linux.txt"
      - ".github/workflows/codex-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify-codex-skills
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install existing hashed metadata-check profile
        run: python -m pip install --require-hashes -r locks/requirements-ci-yaml-lock-linux.txt

      - name: Validate metadata, inventory, references and Python syntax
        run: python scripts/check_codex_skills.py

      - name: Validate shell asset syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for script in .agents/skills/**/*.sh; do
            bash -n "$script"
          done

      # Do not bootstrap a second full product suite for instruction edits.
      # Runtime/checker/native acceptance stays in its existing dedicated jobs.
