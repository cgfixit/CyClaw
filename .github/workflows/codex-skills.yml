name: Codex Skills

on:
  push:
    branches: [main]
    paths:
      - ".codex/skills/**"
      - ".github/workflows/codex-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - ".codex/skills/**"
      - ".github/workflows/codex-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify-codex-skills
    # ubuntu-latest is 24.04. Stock AppArmor denies bwrap user namespaces, and
    # verify.sh runs the suite that refuses Linux verification without them
    # (agentic/executor/hard_sandbox.py). Load the same profile the test job loads.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux verification filesystem/PID/network sandbox
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
          sudo install -m 0644 deploy/apparmor/cyclaw-bwrap /etc/apparmor.d/cyclaw-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/cyclaw-bwrap
          bwrap --die-with-parent --new-session --unshare-all --cap-drop ALL \
            --ro-bind / / --proc /proc --dev /dev /bin/true

      - name: Validate Codex skill metadata and shell assets
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob globstar
          found=0
          for skill_dir in .codex/skills/*; do
            [ -d "$skill_dir" ] || continue
            found=1
            test -f "$skill_dir/SKILL.md"
            grep -q '^---$' "$skill_dir/SKILL.md"
            grep -q '^name:' "$skill_dir/SKILL.md"
            grep -q '^description:' "$skill_dir/SKILL.md"
          done

          if [ "$found" -eq 0 ]; then
            echo "No .codex skills found"
            exit 1
          fi

          for script in .codex/skills/**/*.sh; do
            bash -n "$script"
          done

          for verifier in .codex/skills/*/verify.sh; do
            bash "$verifier"
          done
