# Blocking check: is this PR a complete fill of .github/PULL_REQUEST_TEMPLATE.md?
#
# Same rules, and the same [key] per failure, as scripts/check-pr-template.sh
# (the local pre-flight humans and coding agents run before opening a PR);
# tests/test_pr_template_check_parity.py runs both on shared fixtures, so
# change them together. Required: every body heading of the template
# (Proposed changes, Types of changes, Benefits / why, Risks to monitor,
# Checklist, Further comments, Suggested merge order of open PRs, ELI5), at
# least one ticked box under Types of changes and under Checklist, a
# trial-merge note, `## ELI5` as the LAST heading, `Last updated: YYYY-MM-DD
# HH:MM ET` as the last non-blank line, an invariant mention when a core-path
# file changes, a `[prefix] - Sentence` title (the commit-msg hook's prefixes
# and exemptions), and a .githooks-allowed head branch name. Fenced code
# blocks and HTML comments are ignored, so the template's own example does not
# count. Dependabot is skipped (changelog tables). Verify / Base stay
# Grok-local extras and are not required here.
#
# Posts a sticky comment AND fails the job when rules fail so every vendor
# (Kimi, Codex, Grok, GitHub UI) is gated the same way. Git hooks cannot see
# gh pr create / GitHub API bodies.
#
# No checkout, no execution of anything from the PR: this only reads the PR
# body, title, head ref and changed-file list from the event payload and API.

name: PR Template Check

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [main, cc]

permissions: {}

concurrency:
  group: pr-template-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check PR body against template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot bodies are auto-generated changelog tables, not authored
    # descriptions -- the template does not apply to them.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    permissions:
      pull-requests: write

    steps:
      - name: Evaluate template coverage and upsert comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- cyclaw-pr-template-check -->";
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const title = pr.title || "";
            const branch = (pr.head && pr.head.ref) || "";
            // A head in another repository (a contributor fork, or a deleted
            // one) is outside .githooks' reach, and the template scopes branch
            // naming to agent-opened PRs, so the branch rule skips it.
            const headRepo = pr.head && pr.head.repo && pr.head.repo.full_name;
            const isFork = !headRepo || headRepo !== (pr.base && pr.base.repo && pr.base.repo.full_name);

            // Rules mirror scripts/check-pr-template.sh one for one, keys
            // included. tests/test_pr_template_check_parity.py runs both.
            const missing = [];
            const fail = (key, label) => missing.push({ key, label });

            // Headings inside fenced examples or HTML comments do not count.
            const prose = body.replace(/\r\n/g, "\n").replace(/```[\s\S]*?```/g, "").replace(/<!--[\s\S]*?-->/g, "");

            const sections = [
              ["proposed-changes", "## Proposed changes", /^#{1,4}\s*proposed changes\b/im],
              ["types", "## Types of changes", /^#{1,4}\s*types of changes\b/im],
              ["benefits", "## Benefits / why", /^#{1,4}\s*benefits\b/im],
              ["risks", "## Risks to monitor", /^#{1,4}\s*risks to monitor\b/im],
              ["checklist", "## Checklist", /^#{1,4}\s*checklist\b/im],
              ["further-comments", "## Further comments", /^#{1,4}\s*further comments\b/im],
              ["merge-order", "## Suggested merge order of open PRs", /^#{1,4}\s*suggested merge order\b/im],
              ["eli5", "## ELI5", /^#{1,4}\s*eli5\b/im],
            ];
            for (const [key, heading, re] of sections) {
              if (!re.test(prose)) fail(key, `Missing section \`${heading}\``);
            }
            if (!/trial[- ]merge/i.test(prose)) {
              fail("trial-merge", "Merge-order section must say trial merges were verified (the words `trial merge`)");
            }

            // Text between a heading and the next heading of any level.
            const sectionText = (re) => {
              const lines = prose.split("\n");
              const i = lines.findIndex((l) => re.test(l));
              if (i < 0) return null;
              const out = [];
              for (let j = i + 1; j < lines.length && !/^#{1,6}\s/.test(lines[j]); j++) out.push(lines[j]);
              return out.join("\n");
            };
            const ticked = /^\s*[-*]\s*\[[xX]\]/m;
            const types = sectionText(sections[1][2]);
            if (types !== null && !ticked.test(types)) fail("types-ticked", "Tick at least one box under `## Types of changes`");
            const checklist = sectionText(sections[4][2]);
            if (checklist !== null && !ticked.test(checklist)) fail("checklist-ticked", "Tick at least one box under `## Checklist`");

            const headings = prose.match(/^#{1,6}\s+.*$/gm) || [];
            const lastHeading = headings[headings.length - 1];
            if (sections[7][2].test(prose) && lastHeading && !/^#{1,6}\s*eli5\b/i.test(lastHeading)) {
              fail("eli5-last", "`## ELI5` must be the last heading (the last one is `" + lastHeading + "`)");
            }

            const lastLine = prose.split("\n").map((l) => l.trimEnd()).filter((l) => l.trim() !== "").pop() || "";
            if (!/^Last updated: \d{4}-\d{2}-\d{2} \d{2}:\d{2} ET$/.test(lastLine)) {
              fail("stamp", "Last non-blank line must be `Last updated: YYYY-MM-DD HH:MM ET`");
            }
            if (body.trim().length < 40) fail("too-short", "Body is under 40 characters");

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // The full I6 "core six" from CLAUDE.md section 3, plus
            // utils/personality.py (I5 soul governance) and config.yaml.
            const corePathRe = /^(gate\.py|gate_ops\.py|gate_auth\.py|gate_memory\.py|graph\.py|mcp_hybrid_server\.py|utils\/personality\.py|config\.yaml)$/;
            if (files.some((f) => corePathRe.test(f.filename)) && !/invariant/i.test(prose)) {
              fail(
                "invariant",
                "Touches a core-path file (gate*.py, graph.py, mcp_hybrid_server.py, utils/personality.py, config.yaml) but never mentions an invariant",
              );
            }

            // Same prefixes and exemptions as .githooks/commit-msg, since the
            // squash-merge commit subject is this title.
            const prefixes = "invariant|governance|fsconnect|agentic|rag|harness|security|docs|infra|fix|feat";
            const titleExempt = /^(Merge |Revert |fixup! |squash! |Amend! )/.test(title) || /^(chore|build|ci)\(deps\)/.test(title);
            if (!titleExempt && !new RegExp(`^\\[(${prefixes})\\] - \\S`).test(title)) {
              fail("title", `Title must read \`[prefix] - Short sentence\` with prefix one of ${prefixes}`);
            }

            // Same allowlist as .githooks/pre-commit and pre-push; fork heads skip it.
            const branchOk =
              /^(main|master|develop)$/.test(branch) ||
              /^(grok|claude|codex|kimi|agent|CyClaw|cyclaw|dependabot|renovate|release|hotfix)\/.+/.test(branch);
            if (!isFork && !branchOk) {
              fail("branch", `Head branch \`${branch}\` needs a vendor prefix (claude/, codex/, grok/, kimi/, agent/, CyClaw/, cyclaw/)`);
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker),
            );

            if (missing.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `${marker}\nPR is a complete fill of \`.github/PULL_REQUEST_TEMPLATE.md\` (every section, ticked boxes, merge order, ELI5 last, last-updated stamp, title, branch).`,
                });
              }
              core.info("PR is a complete template fill.");
              return;
            }

            const lines = [
              marker,
              "**PR template check** (blocking)",
              "",
              "This PR is not a complete fill of `.github/PULL_REQUEST_TEMPLATE.md`:",
              "",
              ...missing.map((c) => `- [${c.key}] ${c.label}`),
              "",
              "This check **fails the job**. Copy `.github/PULL_REQUEST_TEMPLATE.md`, fill every section, and edit the PR. Check locally first with `scripts/check-pr-template.sh --title ... --branch ... body.md`. Verify / Base are optional here (Grok-local push extras).",
            ];
            const commentBody = lines.join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody,
              });
            }

            core.setFailed(`PR template check failed: ${missing.map((c) => c.key).join(", ")}`);
