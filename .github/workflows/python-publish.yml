# Upload a Python package to PyPI when a GitHub Release is published.
# Actions are full-SHA-pinned (same policy as ci.yml / codeql.yml) so a
# compromised tag cannot rewrite the publish path. No extra secrets/keys
# beyond the trusted-publishing OIDC token.

# Keep this filename aligned with the workflow authorized by PyPI's trusted publisher.
name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Same PyPI read budget as ci.yml. Still no pip cache: zizmor's
# cache-poisoning audit flags one on this release-publish workflow
# (see the setup-python step below).
env:
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Match requires-python / CI matrix (pyproject.toml: >=3.12).
          python-version: "3.12"
          # Deliberately no pip cache here (unlike numbat-rules.yml's
          # identical-looking addition): zizmor's cache-poisoning audit
          # flags caching on this release:published-triggered, PyPI-publishing
          # workflow as a runtime-artifact-poisoning risk -- a cache written
          # by an earlier, less-trusted run could be restored into a later
          # trusted publish run. ci.yml's zizmor step hard-fails the build on
          # any high-severity finding; see
          # https://docs.zizmor.sh/audits/#cache-poisoning.

      - name: Build release distributions
        run: |
          python -m pip install --upgrade "pip==26.2.2"
          # Exact pin, same policy as the pip pin above (current stable 1.6.0;
          # ci.yml's "Build the wheel" step mirrors this -- keep them in step).
          python -m pip install "build==1.6.0"
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - release-build
    permissions:
      # Mandatory for trusted publishing (OIDC).
      id-token: write

    environment:
      name: pypi
      # url: https://pypi.org/p/cyclaw

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
