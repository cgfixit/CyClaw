# .github/workflows/devskim.yml
#
# Static security scan with Microsoft DevSkim
# Tailored for CGFixIT/CyClaw (Python project, hatchling/pyproject.toml)

name: "DevSkim – CyClaw"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Every Sunday at 03:11 UTC
    - cron: "11 3 * * 0"
  workflow_dispatch:

# Workflow-level grant stays read-only; the SARIF-upload permission is declared
# per-job below. zizmor's excessive-permissions audit flags a workflow-level
# `security-events: write` because every future job in this workflow would
# inherit it silently -- see trivy.yml/pr-template-check.yml for the same shape.
permissions:
  contents: read          # checkout

# Cancel superseded in-progress runs on the same branch to save CI minutes;
# pushes to main are exempt so main keeps a complete scan history.
concurrency:
  group: devskim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  devskim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload SARIF
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # DevSkim is a regex/pattern matcher, not a Python import resolver, so the
      # multi-GB torch+requirements install buys nothing while burning CI minutes.

      # Run DevSkim
      - name: Run DevSkim scanner
        id: devskim
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1
        with:
          # Scan all supported source formats; same-line DevSkim comments carry
          # site-specific exceptions. The action defaults to GITHUB_WORKSPACE.
          output-filename: devskim-results.sarif
          # Accepted in #1556: DS162092 is a ManualReview advisory matching only
          # localhost/127.0.0.1, not an insecure-transport or bind-address rule.
          # Loopback is intentional throughout this local gateway, its fixtures
          # and operator tools (docs/THREAT_MODEL.md). Annotating every occurrence
          # would add noise to code, docstrings and generated training examples.
          # DS137138 remains enabled for insecure HTTP, as does DS106863 for DES.
          # DevSkim 1.0.100 detects real DES tokens without matching "description";
          # the old repo-wide DES substring-noise exclusion is no longer needed.
          exclude-rules: 'DS162092'
          # Only exact data files are exempt beyond the action's .git/bin defaults:
          # - The SHA-256-pinned Unicode table contains upstream character names
          #   mistaken for task markers. Editing it would break its integrity pin.
          #   Its Python generator is scanned, with a digest-specific inline ignore.
          # - The generated training transcript contains prose about content hashes,
          #   not password-hashing code; JSON cannot carry suppression comments.
          #   Its Python producers and every other JSON file remain in scan scope.
          ignore-globs: "**/.git/**,**/bin/**,**/utils/unicode_data/confusables-17.0.0.txt,**/tools/lora_finetune/cyclaw_training.json"
          # The action publishes findings rather than failing on their count.
          # Review the SARIF; a green upload alone does not mean zero findings.

      # Upload SARIF to GitHub Security tab
      - name: Publish findings to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          sarif_file: devskim-results.sarif

      # Also keep the SARIF as a downloadable run artefact (optional)
      - name: Save SARIF artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: devskim-results
          path: devskim-results.sarif
