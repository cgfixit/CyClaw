# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# .github/dependabot.yml
# Dependabot configuration for CyClaw
#
# Ecosystems:
#   1. pip  – updates requirements*.txt / pyproject.toml in repo root
#   2. Docker – bumps the digest-pinned Dockerfile base
#   3. GitHub Actions – bumps versions in .github/workflows/*
# (npm ecosystem removed with the unused root package.json scaffolding.)
#
# WHAT THE pip ECOSYSTEM BELOW ACTUALLY COVERS (verified 2026-08-02 against
# dependabot-core's own source, not inference):
#   - pyproject.toml's [project.optional-dependencies] IS parsed. Its Python
#     file parser treats a project as PEP 621 when either `project.dependencies`
#     or `project.optional-dependencies` is present, and parses both
#     (python/lib/dependabot/python/file_parser/pyproject_files_parser.rb).
#     So every optional extra — postgres, pgvector, numbat-cel, dev, test —
#     is in scope for version updates via the pip-all group below. No extra
#     config is needed.
#   - constraints.txt IS edited in practice. The 2026-08-02 reading above
#     said a constraints file no requirements file references via `-c` is
#     never fetched, but the October pip-all PRs (#1717, #1724) rewrote
#     constraints.txt alongside pyproject.toml and requirements*.txt. Why it
#     is fetched now is unverified. Either way
#     .claude/skills/dep-guard/check_deps.py (D5/D6, and D9 for
#     environment.yml) still fails CI on pyproject/constraints drift.
#   - locks/ is excluded below (exclude-paths). Those PRs also rewrote every
#     hashed lock (RIP <3) but never the locks/*-inputs.json records, so
#     scripts/check_lock_contract.py failed them by construction, and every
#     one conflicted with any other lock change. Dependabot cannot run
#     scripts/refresh-runtime-lock.sh (arm64 macOS only), so it should not
#     write its output at all.
#
# WHAT A pip PR FROM HERE IS: a shopping list, not a merge candidate. It moves
# pins in constraints.txt / pyproject.toml / requirements*.txt and stays red
# on the lock contract until the operator checks it out on the Mac, runs the
# refresh script (locks/README.md "Changing a pin") and pushes the regenerated
# locks onto the same branch. An indirect dependency with no constraints.txt
# pin (aiohttp before #1715 pinned it) gets no PR from here; the daily
# pip-audit cron on main is what catches those.
#
# CVE SCANNING of those same extras is a separate concern and lives in
# .github/workflows/pip-audit.yml's `scan-optional` job — the base `scan` job
# audits requirements.txt, which carries zero extras by scope contract.
#
# Schedule: pip monthly (each PR costs a Mac re-lock, so weekly 50-package
# batches only went stale); docker and github-actions weekly on Wednesday.
# pip splits into two groups: minor+patch in one PR, majors in their own, so
# a major (huggingface-hub 1->2 rode inside #1724) is read before it is taken.
# Majors are grouped, not ignored: ignore rules also suppress security updates.
# github-actions keeps a single catch-all group.

version: 2

updates:
  # 1) Python (pip)
  - package-ecosystem: "pip"
    directory: "/"                 # requirements*.txt / pyproject.toml in repo root
    # Hashed locks live in locks/ and are generated by scripts/refresh-*-lock.sh.
    # Dependabot cannot regenerate hashes, so it never edits them (see header).
    exclude-paths:
      - "locks/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - python
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # numpy is intentionally pinned to 1.x: numpy 2.x removes np.float_, which
      # breaks chromadb's onnxruntime dependency (see the numpy pin comment in
      # requirements.txt).
      - dependency-name: "numpy"
        versions: [">=2.0.0"]
      # torch moves only by hand: the +cpu local version, the CPU-index hashed
      # locks, and environment.yml cannot be regenerated by Dependabot
      # (PR #1661 dropped +cpu and broke every install leg).
      - dependency-name: "torch"
      # pydantic and pydantic-core move in lock-step across all four install
      # surfaces and dep-guard's _PYDANTIC_LOCKSTEP; bump them by hand together.
      - dependency-name: "pydantic"
      - dependency-name: "pydantic-core"
      # dataclasses-json (via nemoguardrails) requires marshmallow<4 (PR #1661).
      - dependency-name: "marshmallow"
        versions: [">=4.0.0"]
      # langchain-core requires uuid-utils<1.0 (PR #1661).
      - dependency-name: "uuid-utils"
        versions: [">=1.0.0"]

  # 2) Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker

  # 3) GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"                 # Dependabot scans .github/workflows/**
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - ci
    groups:
      actions-all:
        patterns:
          - "*"
