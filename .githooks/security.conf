# shellcheck shell=bash disable=SC2034,SC2154  # sourced by _security.sh: it reads these, and sec__root/sec__say come from it
# CyClaw values for .githooks/_security.sh. Sourced after the generic defaults,
# so append with += rather than replacing a list.

# Runtime state and operator-local files. .gitignore already lists these; the
# hook is what still holds when someone runs `git add -f`.
SEC_BLOCKED_GLOBS+=(
  # The untracked per-clone overrides: SEC_PII_REGEX there is the operator's
  # own identifiers, the one list that must never be published.
  '.githooks/security.local.conf'
  'docs/memories/CONSOLIDATED.md'
  'data/memory/*' 'data/auth/*'
  'data/personality/soul.md.bak'
  'logs/*'
  '.rclone-state/*'
  # Manual backups of ignored runtime dirs (index/, logs/, .emb_cache/, the
  # soul DB) are not covered by the rules for the originals.
  '*.rootowned-bak' '*.rootowned-bak/*' '*/*.rootowned-bak/*'
  # Add the filename(s) of the LOCAL-ONLY global memory pack here.
)

# Tracked on purpose: flags only, no credentials.
SEC_BLOCKED_EXCEPT+=(
  'docs/security-philosophy/cyclaw_telemetry_kill.env'
  'macos/ollama-mlx.env'
)

# Must stay ignored (checked with git check-ignore on every commit).
SEC_IGNORE_PROBES+=(
  'data/memory/probe.db' 'data/auth/probe.db' 'data/personality/probe.db'
  'docs/memories/CONSOLIDATED.md' 'rclone.conf' 'logs/probe.log'
  'index.rootowned-bak/probe'
)

# CLAUDE.md §7 Tier High, limited to files where an edit silently changes or
# silences a control. graph.py edges are covered by invariant-guard below.
SEC_PROTECTED_GLOBS+=(
  'data/personality/soul.md'
  'utils/sanitizer.py'
  'gate_auth.py'
  '.gitleaksignore' '.trivyignore.yaml' '.osv-scanner.toml'
  '.claude/skills/dotenv-guard/baseline.txt'
)

# Synthetic fixtures already in the tree (redaction and sanitizer tests).
# Container and fixture home directories already used throughout the tests.
SEC_GENERIC_USERS+='|cyclaw|alice-shield'

SEC_ALLOW_REGEX='AKIAIOSFODNN7EXAMPLE|sk-ant-api03-(testkey|abcdefghij)|sk-ant-SUPERSECRETVALUE|xai-abcdefghij'

# Same blocking rule set as .github/workflows/lint.yml, on staged files only.
sec_repo_pre_commit() {
  local py
  py="$(printf '%s\n' "$SEC_FILES" | grep -E '\.py$' || true)"
  [[ -n "$py" ]] || return 0
  if ! command -v ruff >/dev/null 2>&1; then
    sec__say "security gate: ruff not installed -- skipped ruff F,B,S on staged Python (lint.yml still blocks in CI)."
    return 0
  fi
  if ! printf '%s\n' "$py" | tr '\n' '\0' | xargs -0 ruff check --select F,B,S --force-exclude --quiet; then
    sec__say "security gate: ruff F,B,S failed on staged files (lint.yml blocks on the same rules)."
    return 1
  fi
}

# invariant-guard is stdlib-only static analysis (see the ci.yml job of the
# same name). It reads these files: the core six, metrics.py, config.yaml,
# utils/personality*.py, the G1 telemetry-kill appliers, every .py in the five
# out-of-band packages, and its own checker. Run it when any of them is in the
# push, and run it on an export of each pushed commit (git archive), never on
# the working tree: the tree can hold different (clean, uncommitted or stale)
# code from what is being published.
SEC_INVARIANT_TRIGGER='^(gate|gate_ops|gate_auth|gate_memory|graph|mcp_hybrid_server|metrics)\.py$'
SEC_INVARIANT_TRIGGER+='|^config\.yaml$|^utils/(personality[^/]*|gen_cert|authn_cli)\.py$'
SEC_INVARIANT_TRIGGER+='|^retrieval/(vector_store|indexer|clear_cache)\.py$'
SEC_INVARIANT_TRIGGER+='|^(agentic|sync|guardrails|telegram|opentweet)/.*\.py$'
SEC_INVARIANT_TRIGGER+='|^\.claude/skills/invariant-guard/'

sec_repo_pre_push() {
  local sha tmp rc=0 guard='.claude/skills/invariant-guard/check_invariants.py'
  printf '%s\n' "$SEC_FILES" | grep -E "$SEC_INVARIANT_TRIGGER" >/dev/null || return 0
  if ! command -v python3 >/dev/null 2>&1; then
    sec__say "security gate: python3 not found -- skipped invariant-guard (CI blocks on the same check)."
    return 0
  fi
  for sha in $SEC_PUSH_SHAS; do
    tmp="$(mktemp -d "${TMPDIR:-/tmp}/cyclaw-invguard.XXXXXX")" || {
      sec__say "security gate: cannot create a temp dir for invariant-guard."
      return 1
    }
    if ! git -C "$sec__root" archive --format=tar "$sha" |
         tar -x -C "$tmp"; then
      sec__say "security gate: could not export ${sha} for invariant-guard."
      rc=1
    elif [[ ! -f "$tmp/$guard" ]]; then
      sec__say "security gate: ${sha} has no $guard -- skipped invariant-guard for it."
    elif ! python3 -B "$tmp/$guard" --repo-root "$tmp" >&2; then
      sec__say "security gate: invariant-guard failed on pushed commit ${sha} (CI blocks on the same check)."
      rc=1
    fi
    rm -rf "$tmp"
  done
  return "$rc"
}
