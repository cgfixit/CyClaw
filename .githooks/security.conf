# shellcheck shell=bash disable=SC2034  # sourced by _security.sh, which reads these
# CyClaw values for .githooks/_security.sh. Sourced after the generic defaults,
# so append with += rather than replacing a list.

# Runtime state and operator-local files. .gitignore already lists these; the
# hook is what still holds when someone runs `git add -f`.
SEC_BLOCKED_GLOBS+=(
  'docs/memories/CONSOLIDATED.md'
  'data/memory/*' 'data/auth/*'
  'data/personality/soul.md.bak'
  'logs/*'
  '.rclone-state/*'
  # Manual backups of ignored runtime dirs (index/, logs/, .emb_cache/, the
  # soul DB) are not covered by the rules for the originals.
  '*.rootowned-bak' '*.rootowned-bak/*' '*/*.rootowned-bak/*'
  # Add the filename(s) of the LOCAL-ONLY global memory pack here.
)

# Tracked on purpose: flags only, no credentials.
SEC_BLOCKED_EXCEPT+=(
  'docs/security-philosophy/cyclaw_telemetry_kill.env'
  'macos/ollama-mlx.env'
)

# Must stay ignored (checked with git check-ignore on every commit).
SEC_IGNORE_PROBES+=(
  'data/memory/probe.db' 'data/auth/probe.db' 'data/personality/probe.db'
  'docs/memories/CONSOLIDATED.md' 'rclone.conf' 'logs/probe.log'
  'index.rootowned-bak/probe'
)

# CLAUDE.md §7 Tier High, limited to files where an edit silently changes or
# silences a control. graph.py edges are covered by invariant-guard below.
SEC_PROTECTED_GLOBS+=(
  'data/personality/soul.md'
  'utils/sanitizer.py'
  'gate_auth.py'
  '.gitleaksignore' '.trivyignore.yaml' '.osv-scanner.toml'
  '.claude/skills/dotenv-guard/baseline.txt'
)

# Synthetic fixtures already in the tree (redaction and sanitizer tests).
# Container and fixture home directories already used throughout the tests.
SEC_GENERIC_USERS+='|cyclaw|alice-shield'

SEC_ALLOW_REGEX='AKIAIOSFODNN7EXAMPLE|sk-ant-api03-(testkey|abcdefghij)|sk-ant-SUPERSECRETVALUE|xai-abcdefghij'

# Same blocking rule set as .github/workflows/lint.yml, on staged files only.
sec_repo_pre_commit() {
  local py
  py="$(printf '%s\n' "$SEC_FILES" | grep -E '\.py$' || true)"
  [[ -n "$py" ]] || return 0
  command -v ruff >/dev/null 2>&1 || return 0
  if ! printf '%s\n' "$py" | tr '\n' '\0' | xargs -0 ruff check --select F,B,S --force-exclude --quiet; then
    sec__say "security gate: ruff F,B,S failed on staged files (lint.yml blocks on the same rules)."
    return 1
  fi
}

# invariant-guard is stdlib-only static analysis (see the ci.yml job of the
# same name). Run it only when a file it reads is in the push.
sec_repo_pre_push() {
  printf '%s\n' "$SEC_FILES" | grep -E '^(gate\.py|gate_ops\.py|graph\.py|mcp_hybrid_server\.py|config\.yaml)$' >/dev/null || return 0
  command -v python3 >/dev/null 2>&1 || return 0
  if ! python3 .claude/skills/invariant-guard/check_invariants.py >&2; then
    sec__say "security gate: invariant-guard failed (CI blocks on the same check)."
    return 1
  fi
}
