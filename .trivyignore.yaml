vulnerabilities:
  # Debian 12 image exceptions: exact package versions, reviewed in #1629.
  # Do not renew without checking Debian fixes and the image dependency chain.
  - id: CVE-2026-88647
    purls:
      - pkg:deb/debian/libgnutls30@3.7.9-2%2Bdeb12u7
    expired_at: 2026-11-01
    statement: >-
      libgnutls30 is retained by APT in the pinned Python base. Debian has no
      fixed bookworm or trixie version as of 2026-10-13; upstream disputes
      the security classification. Temporary acceptance, not a patch:
      https://github.com/cgfixit/CyClaw/issues/1629 (see SECURITY.md).
