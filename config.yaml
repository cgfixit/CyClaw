# CyClaw runtime configuration; subsystem loaders validate values and supply defaults.
# policy.prompt_filter patterns are compiled by utils/sanitizer.py with IGNORECASE | DOTALL.

app:
  name: "cyclaw"
  env: "local"
  mode: "hybrid"  # "offline" | "hybrid"
  # Read by no code (not FastAPI debug); verbosity is logging.level.
  debug: true

models:
  local_llm:
    # Operator-owned model hosts (container/LAN) that may receive local context
    # and soul text. Exact hostname/IP match; loopback is always allowed.
    trusted_hosts: []
    provider: "ollama"
    base_url: "http://127.0.0.1:11434/v1"  # DevSkim: ignore DS162092,DS137138 - Ollama loopback, offline-only
    # Optional api_key (not set here; quote numeric-looking values). With no key,
    # llm/client.py sends no Authorization header. fallback.api_key is separate.
    model: "qwen3.8:27b-mlx"            # keep in sync with guardrails.model
    # none | low | medium | high | max; sent only when provider is "ollama".
    # Absent or empty omits the field (Ollama then thinks by default); an invalid
    # value fails at boot. "none" requests thinking off; older Ollama rejects it,
    # see docs/! How-To-Guides/OLLAMA_SETUP.md.
    reasoning_effort: "none"
    # Output token cap. graph.py sizes input by characters, not the tokenizer,
    # and its minimum context allowance can exceed that estimate, so size the
    # backend window for input plus output (see retrieval.max_context_tokens).
    max_tokens: 4096
    temperature: 0.2
    # HTTP timeout. gate.py cancels only the await, so llm/client.py caps each
    # POST at the remaining graph budget and refuses a retry that would overrun
    # it. Measure throughput with scripts/measure_local_llm_throughput.py.
    timeout_sec: 720  # Boot requires api.graph_timeout_sec >= timeout_sec + 30.
    retry:                  # transport/5xx/429 retried; timeouts and other 4xx fail fast
      max_retries: 2        # extra attempts beyond the first
      backoff_base_sec: 0.5 # delay = min(backoff_base_sec * 2**attempt, backoff_max_sec) (0.5s, 1s)
      backoff_max_sec: 30.0 # ceiling on one sleep, including a Retry-After value
    # Opt-in local failover: a short probe prefers the primary above, else this
    # OpenAI-compatible server. base_url must be loopback and model is required
    # (do not reuse the Ollama tag; LM Studio ids usually differ). graph.py
    # builds one prompt for whichever backend answers and does not read its
    # window, so set LM Studio's own context length to at least the floor noted
    # at retrieval.max_context_tokens (context + max_tokens + ~1500).
    fallback:
      enabled: false
      provider: "lmstudio"                       # not "ollama", so reasoning_effort is not sent
      base_url: "http://127.0.0.1:1234/v1"       # DevSkim: ignore DS162092,DS137138 - LM Studio loopback
      model: "qwen3.8-27b-instruct"              # EXAMPLE ONLY — set to your LM Studio loaded model id when enabling
      probe_timeout_sec: 1.5                     # discovery only; generate still uses timeout_sec
  embeddings:
    provider: "sentence-transformers"
    model: "all-MiniLM-L6-v2"
    dim: 384
    cache_dir: ".emb_cache"
    # Query-cache size is fixed at import: env CYCLAW_EMBED_CACHE_SIZE (default 2048).
    # Only literal true enables this. With it on and a completed index (the
    # indexing.bm25_path file) on disk, the model loads local-only and is never
    # fetched. A fresh machine with no index still bootstraps. The HF offline env
    # vars are set only by retrieval/embeddings.py when it loads local-only,
    # never by utils/telemetry_kill.py.
    offline_after_index: false
  # Local CPU cross-encoder behind the retrieval.min_rerank_score veto
  # (retrieval/rerank.py). Only literal true enables it. First use downloads
  # ~91MB from Hugging Face into models.embeddings.cache_dir; it shares
  # offline_after_index, which can block that fetch. Off or unavailable, the
  # gate uses the cosine rule alone and the audit record says which.
  reranker:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L6-v2"
    # Snapshot measured in PR #1463; a min_rerank_score threshold holds only for
    # these weights, so re-measure after changing it. null follows the Hub's main.
    revision: "233902d25c440f23af6f7d6e94d2946bac0bee0a"  # DevSkim: ignore DS173237 - public Hugging Face commit hash, not a secret
  grok:
    # gate.py builds this client only in hybrid mode with literal enabled: true;
    # graph.py also requires per-request consent and a selected, available client.
    enabled: true
    base_url: "https://api.x.ai/v1"
    model: "grok-4.5"   # External fallback model; local cost estimates live in utils/spend.py.
    timeout_sec: 90     # HTTP timeout per attempt
    max_tokens: 2048
    temperature: 0.2
    # low | medium | high; missing or blank resolves to low, not xAI's default
    # high. "none" and "xhigh" are rejected.
    reasoning_effort: "low"
    retry:                  # timeouts, transport errors, 5xx and 429 retried (429/5xx honor Retry-After); other 4xx never
      max_retries: 2        # extra attempts beyond the first
      backoff_base_sec: 1.0 # same formula and ceiling as local_llm.retry (1s, 2s)
      backoff_max_sec: 30.0
  claude:
    enabled: true
    base_url: "https://api.anthropic.com/v1"
    model: "claude-sonnet-5"   # Second external fallback; same gates and HTTP/retry policy as grok.
    anthropic_version: "2023-06-01"
    timeout_sec: 90
    max_tokens: 2048
    retry:
      max_retries: 2        # extra attempts beyond the first; 429 is retried, other 4xx/auth errors never
      backoff_base_sec: 1.0
      backoff_max_sec: 30.0

corpus:
  path: "data/corpus"
  extensions: [".md", ".txt"]

indexing:
  chroma_path: "index/chroma_db"
  bm25_path: "index/bm25.json"
  collection_name: "cyclaw_kb"
  # chunk_unit "tokens": chunk_size and chunk_overlap count the embedding model's
  # word pieces, and chunk_size includes its 2 special tokens, so 256 equals
  # all-MiniLM-L6-v2's max_seq_length and every chunk is embedded whole. A larger
  # chunk_size is capped at the model window with a warning, and chunk_overlap
  # must stay below chunk_size minus the special tokens (254 here). "words" (the
  # default when the key is absent) counts whitespace words; a window longer than
  # the model's is truncated, so its tail never reaches the semantic leg or the
  # vault-hit gate. Changing any of these three needs a rebuild
  # (python -m retrieval.indexer).
  chunk_unit: "tokens"
  chunk_size: 256
  chunk_overlap: 32
  batch_size: 50
  # Semantic backend. "chroma" (default): embedded, offline PersistentClient.
  # "pgvector": embeddings in PostgreSQL; needs a running server, a deliberate
  # move off local-first.
  vector_backend: "chroma"
  # pgvector DSN, used only with vector_backend=pgvector. Precedence:
  # CYCLAW_VECTOR_DB_URL env, then this key, then CYCLAW_DB_URL env.
  # database_url: null
  # BM25 (keyword) stays a local JSON file (bm25_path) with either backend.

retrieval:
  # Hits per leg. 10 each fills graph.py's 10-chunk context window
  # (LOCAL_CONTEXT_CHUNKS) with fused hits.
  top_k_semantic: 10
  top_k_keyword: 10
  rrf_k: 60                # RRF fusion constant, read by hybrid_search.py
  # Nominal token budget for the prompt INPUT to the local LLM (local_llm and
  # offline_best_effort paths). graph.py reserves room for soul + query + framing,
  # gives the rest to retrieved context, and converts at CHARS_PER_TOKEN = 3 (a
  # heuristic, not a tokenizer bound): 16000 here means 48,000 chars. Do NOT raise CHARS_PER_TOKEN
  # to reclaim characters; that reopens the "0% processing" stall. No-stall rule:
  #   Ollama context length  >=  max_context_tokens + models.local_llm.max_tokens + ~1500
  # At a dense 2 chars/token: 24,000 + 4,096 + ~1,500 = 29,596 <= 32,768
  # (macos/ollama-mlx.env). num_ctx, not this budget, bounds KV memory, so a larger
  # prompt costs prefill time only (measure: scripts/measure_local_llm_throughput.py).
  # Known bound: text under 2 chars/token (CJK, ~1-1.5) overruns the window
  # (48,000/1.5 + 4,096 = 36,096 > 32,768); for such a corpus lower this value or
  # raise num_ctx. The rule assumes policy.prompt_filter.enabled stays true, since
  # that caps the query at max_input_chars.
  # An allowance, not a fill: 10 chunks of <= 256 embedder tokens (~1,000 chars
  # each) use far less for the shipped English corpus.
  max_context_tokens: 16000

  # min_score: RRF fused-rank floor (RRF scale, not cosine). Applies only when no
  # hit carries a cosine score: the keyword-only degrade, or no min_semantic_score.
  # Ranks are zero-based: dual rank-0 with rrf_k=60 is 2/60 ≈ 0.0333 (the hybrid
  # ceiling) and one leg tops out at 1/60 ≈ 0.0167, so 0.028 sends every
  # keyword-only degrade to the user gate.
  min_score: 0.028
  # min_semantic_score: the vault-hit gate whenever cosine (1 - distance) scores
  # exist. A query is a hit when the best cosine in the context window clears it;
  # BM25 need not agree (requiring that rejected answerable paraphrases).
  # Measured with the shipped embedder: off-topic questions top out at ~0.17 on
  # data/corpus and ~0.25 with docs/ indexed; the answerable probes in
  # tests/ci_rag_smoke.py clear it by >= ~0.03.
  min_semantic_score: 0.30
  # min_rerank_score: cross-encoder veto (models.reranker), on the raw-logit scale
  # (0.0 = sigmoid 0.5). A number turns it on: a cosine hit whose best logit in the
  # context window is below it becomes a miss; a miss never becomes a hit. With
  # the reranker off or degraded, the cosine rule decides alone. null (shipped) is
  # shadow mode: the best logit is audited as rerank_best, nothing is vetoed.
  # 0.0 was measured and rejected (PR #1463: it removed every look-alike but
  # also vetoed 10 answerable questions), and a five-model bake-off found no
  # model and threshold that passed (PR #1464, docs/audits/2026-09-26-reranker-bakeoff.md).
  min_rerank_score: null

personality:
  enabled: true
  soul_path: "data/personality/soul.md"
  db_path: "data/personality/cyclaw_soul.db"
  # Hard ceiling (chars) on the soul text prepended to every LLM system prompt.
  # The in-memory soul is truncated to it on load/apply, with a warning; soul.md
  # on disk is untouched. Keep it well below the 48,000-char context budget (see
  # retrieval.max_context_tokens). /soul/apply caps its input at 8192.
  soul_max_chars: 8000
  interaction_ttl_days: 365
  # database_url: null  # Postgres DSN; the CYCLAW_DB_URL env var outranks it. Default
  #                     # SQLite is offline-first. See docs/POSTGRES_BACKEND.md.

# ── Memory subsystem (optional, default-off) ──
# Identity (soul.md) is NOT memory. This block controls the optional facts +
# episodes store under memory/. Every switch ships false; disabled paths are
# no-ops and never raise into /query. Operator guide: docs/memory/README.md
memory:
  enabled: false                    # master switch
  db_path: "data/memory/cyclaw_memory.db"
  facts:
    # Gates retrieval fusion ONLY, never persistence, apply, or read (memory.enabled
    # and propose_apply.enabled gate those). The legacy key `enabled` is still
    # honored; its first read logs a one-time warning.
    retrieval_enabled: false
    max_content_chars: 8192
    max_active: 10000
  episodes:
    enabled: false
    store_raw_query: false          # default: query_hash only (privacy)
    max_answer_summary_chars: 2000
    ttl_days: 365
    prune_every: 100
  retrieval_fusion:
    enabled: false                  # fuse FTS fact hits; also needs facts.retrieval_enabled
    max_hits: 3
    rrf_k: 60
    source_prefix: "memory:fact:"
  propose_apply:
    enabled: false                  # /memory/propose|apply|reject
  export_html:
    enabled: false                  # GET /query/export/html
  consolidation:
    enabled: false                  # stub; true does nothing in v1

policy:
  fallback:
    # Read by no code. External calls are governed by the I3 triple gate
    # (app.mode, models.<provider>.enabled, per-request user confirmation).
    enabled: true
    # Not wired: confirm-then-route is hardcoded in graph.py's user_gate_router.
    # Boot rejects any value but true, so false cannot pose as a live switch.
    require_user_confirm: true
    # true forwards up to 3 retrieved chunks (200 chars each) to that provider.
    send_local_context_to_grok: false
    send_local_context_to_claude: false
    # Cost guard: character ceiling on the prompt sent to each external (paid)
    # provider. Normal queries stay under it; <= 0 disables the cap.
    grok_max_prompt_chars: 8000
    claude_max_prompt_chars: 8000
    # Pre-action hook (issue #1458). Runs after the I3 triple gate allowed a
    # confirmed Grok/Claude call, so it can only deny. Off by default. Once
    # enabled, anything but an explicit allow denies: a crash, timeout or bad
    # exit fails closed (answer_model "hook-denied", audited with a
    # pre_action_hook_reason code). Boot refuses an enabled hook with nothing
    # to run. Engines:
    #   command: `command` gets JSON on stdin (action, provider, model,
    #     query_hash) and answers by exit code: 0 allows, 2 denies.
    #   numbat: the pinned Numbat CLI (numbat 0.2.0 / schema 0.3.0, installed
    #     separately) evaluates the call as a network.indicator event against
    #     the rules_dirs key below. A matching rule with enforce: true denies; other
    #     matches only report. Example rules: tests/fixtures/numbat/gate-rules/.
    # Never set command to `numbat hook ...`: it cannot see the provider or URL,
    # and it exits 0 (read as allow) on errors and most denies.
    # Guide: docs/security-philosophy/numbat_pre_action_gate.md
    # /health shows an enabled hook as "pre_action_hook" (degraded while it
    # cannot run); `cyclaw-metrics` counts verdicts by reason.
    pre_action_hook:
      enabled: false
      engine: command      # command | numbat
      command: []          # argv list, used by engine: command
      numbat:
        binary: "numbat"   # bare name = PATH lookup; a path with a separator is a file (relative = repo root)
        rules_dirs: []     # e.g. ["/etc/numbat/cyclaw-gate"]; required by engine: numbat
      timeout_sec: 5       # clamped to [1, 30]
      # "enforce" (a deny blocks) is the only mode; boot rejects anything else.
      # Old name fail_mode is read when this is absent. Hook failure is always
      # fail-closed, whatever this says.
      verdict_mode: enforce
      # Project each verdict into the Numbat stream (needs numbat.enabled):
      # allow -> network.indicator (allowed); policy deny -> permission.denied;
      # broken hook -> network.indicator (denied). Absent key means false.
      emit_verdict: true
  prompt_filter:
    enabled: true
    # Regexes, single-quoted so backslashes reach re literally. Compiled with
    # re.IGNORECASE | re.DOTALL; check_input first applies NFKC and strips
    # invisible characters. \s+ also spans the newlines in corpus chunks.
    # 40 patterns total, grouped: override/jailbreak, role reassignment, system/new instructions,
    # memory/persistence poisoning, authority/urgency, tool/MCP hijacking,
    # light obfuscation. Probe ids (hx-01, ro-03, ...) are in
    # .claude/skills/injection-redteam/probes.yaml.
    banned_patterns:
      # === Core Override (10) ===
      - 'ignore\s+(previous|all|prior)\s+instructions'
      - 'ignore\s+all\s+previous'
      - 'ignore\s+safety'
      - 'disregard\s+(previous|all|prior)'
      - 'forget\s+(previous|all|prior)\s+instructions'
      - 'override\s+instructions'
      - 'bypass\s+(safety|filters|restrictions|rules)'
      - 'do\s+anything\s+now'
      # hx-01: a filler word after "ignore all" and the synonyms
      # "directives"/"guidance" defeated the patterns above.
      - 'ignore\s+(all|any)\s+\S+\s+(instructions|directives|guidance)'
      # Same bypass without "all"/"any" ("ignore earlier directives").
      - 'ignore\s+earlier\s+(instructions|directives|guidance)'

      # === Role Reassignment / Impersonation (6) ===
      - 'you\s+are\s+now'
      - 'you\s+are\s+no\s+longer'
      - 'pretend\s+(you\s+are|to\s+be)'
      # Bare "act as <profession>" must pass ("act as local counsel"), so a
      # jailbreak complement is required, with up to 4 filler words between
      # ("act as a rogue AI with no limits"). Covers invariant-guard G3 ("act as your developer")
      # and ro-03 ("act as a penetration tester...").
      - 'act\s+as\s+(?:\S+\s+){0,4}(if\b|your\s+developer|uncensored|dan\b|without\b|no\s+(?:restrictions?|filters?|limits?|rules?)|jailbreak|penetration\s+tester|unrestricted|\bai\b)'
      - 'roleplay\s+as|assume\s+the\s+role'
      # hx-02: "from now on you will behave/act as" role swap.
      - 'from\s+now\s+on\s+you\s+(will\s+)?(behave|act)\s+as'

      # === System / New Instructions (7) ===
      - 'new\s+instructions\s*:'
      - 'system\s+prompt\s*:'
      - 'admin\s*:|developer\s+override'
      - 'sudo\s+mode|root\s+access'
      - 'maintenance\s+mode.*safety\s+filters\s+disabled'
      - 'critical\s+update\s+to\s+your\s+instructions'
      # hx-03: authority spoof ("a message from your creators").
      - 'message\s+from\s+your\s+(creators?|developers?|makers?)'

      # === Memory / Persistence Manipulation (8) — HIGH PRIORITY for RAG + soul ===
      - 'remember\s+(for\s+future|this\s+for\s+later|as\s+permanent|in\s+memory)'
      - 'save\s+this\s+(for\s+later|in\s+your\s+memory|permanently)'
      - 'update\s+your\s+(memory|knowledge\s+base|soul)'
      - 'store\s+this\s+as\s+(a\s+rule|permanent|core\s+instruction)'
      - 'core\s+instruction,\s*never\s+forget'
      - 'add\s+to\s+your\s+(knowledge|memory|personality)\s+base'
      # me-05: "store this as A core instruction" (with the article).
      - 'store\s+this\s+as\s+a\s+core\s+instruction'
      # hx-05: "persist ... across sessions: <directive>". Requires the colon
      # so "persist my settings across sessions" still passes.
      - 'persist\s+.{0,30}across\s+sessions\s*:\s*\S'

      # === Authority / Urgency / Social Engineering (4) ===
      # Bare "urgent" must pass ("urgent deadline"); require an action word.
      - 'critical\s+update|important\s+update'
      - 'from\s+(it\s+department|system\s+administrator)'
      - 'urgent\s+(action|request|override|update)|action\s+required'
      # au-02: "from THE IT department: <directive>". Requires the colon so
      # "I got an email from the IT department, is this phishing?" passes.
      - 'from\s+the\s+(it\s+department|system\s+administrator)\s*:\s*\S'

      # === Tool / Action / MCP Hijacking (2) ===
      - 'execute\s+command|run\s+this\s+code'
      - 'call\s+function|use\s+tool\s+to|invoke\s+tool'

      # === Light Obfuscation / Jailbreak Variants (3) ===
      # Bare "base64" must pass; pair it only with execute phrasing.
      - 'jailbreak|dan\s+mode|developer\s+mode'
      - 'decode\s+and\s+execute|base64.{0,40}execute|execute.{0,40}base64'
      # hx-04: "reveal your instructions" extraction phrasing.
      - 'reveal\s+(your\s+)?(instructions|system\s+prompt)'
    max_input_chars: 4000
  privacy:
    redact_emails: true
    redact_ips: true
    redact_secrets_like:
      # Single source of truth for audit-log secret redaction
      # (utils.logger.redact_sensitive); covers the shapes gate._sanitize_error
      # strips from HTTP bodies. api_key needs a ':' or '=' separator, so prose
      # like "the api key docs" is not redacted.
      - 'Bearer\s+[A-Za-z0-9\-_.]+'                                   # Authorization bearer tokens
      - '[Aa][Pp][Ii][_-]?[Kk][Ee][Yy]["''\s]*[:=]["''\s]*[\w\-.]{4,}'  # api_key= / "api-key": forms
      - "AKIA[0-9A-Z]{16}"           # AWS access keys
      - "xox[baprs]-[0-9a-zA-Z-]+"  # Slack tokens
      - "ghp_[a-zA-Z0-9]{36}"        # GitHub PATs
      - "sk-[a-zA-Z0-9]{20,}"        # OpenAI-style keys
      # Anthropic keys contain hyphens, which the sk- pattern above excludes.
      - "sk-ant-[a-zA-Z0-9_-]{20,}"  # Anthropic (Claude) API keys
      - "xai-[a-zA-Z0-9]{20,}"       # xAI (Grok) API keys

api:
  # gate.py's main() refuses a non-loopback host, because /health, / and
  # /static/* carry no authentication (/query none unless auth.enabled). Two ways past loopback:
  # CYCLAW_ALLOW_NON_LOOPBACK_BIND=1 (put your own auth in front first), or the
  # auth+TLS route described above the auth: block. config-guard C4 checks only
  # committed config; this guard covers the working copy. The container CMD
  # skips main() and binds 0.0.0.0 in-container; docker-compose publishes
  # 127.0.0.1:8787:8787 only.
  host: "127.0.0.1"  # DevSkim: ignore DS162092 - loopback-only binding by design
  port: 8787
  # Server-side deadline (seconds) for one /query: retrieval + graph + LLM. The
  # graph invoke runs under asyncio.wait_for and returns HTTP 504 on expiry.
  # Boot requires graph_timeout >= llm_timeout + 30 (models.local_llm.timeout_sec),
  # so the inner LLM timeout fires first and the operator sees its diagnostic
  # error, not a generic 504. The 30s floor covers retrieval, routing and audit;
  # the shipped 60s margin also covers the first
  # query's cold CPU embedder load (retrieval/embeddings.py EMBED_DEVICE).
  graph_timeout_sec: 780  # > models.local_llm.timeout_sec (720) by 60s; see above
  # Whether GET /health probes Grok and Claude for liveness. Ships false as a
  # security choice: /health has no auth and no rate limit, so probing there
  # lets any local process, or any page your browser loads (a CORS-simple GET),
  # trigger an outbound call to a third party on your API key. False means
  # /health makes zero outbound calls. app.mode, the provider enabled flags and
  # the /query triple gate are unaffected either way.
  health_probe_external_providers: false
  rate_limit:
    max_requests: 60       # per-IP request ceiling within the window
    window_seconds: 60     # sliding-window length in seconds
    # null = in-memory (resets on restart). A sqlite path such as
    # "data/rate_limits.db" keeps per-IP counters across restarts.
    persist_path: null
    # Optional Postgres DSN ("postgresql://user:pass@host/dbname"); takes
    # precedence over persist_path. Order: this key, then CYCLAW_RATELIMIT_DB_URL.
    # Never falls back to CYCLAW_DB_URL (the personality DB).
    # database_url: null
  # Only the literal boolean true enables TLS; quoted "true" is OFF. When on,
  # `python gate.py` / `cyclaw-server` pass certfile/keyfile to uvicorn
  # (relative paths anchor to the repo root). Missing or unreadable files
  # refuse to start: no plaintext socket with Secure cookies. The Docker CMD
  # bypasses this wiring. Generate a LAN self-signed pair with `cyclaw-gen-cert`.
  # The flag also marks the session cookie Secure and is one of the auth+TLS
  # bind-guard conditions. See docs/AUTHENTICATION_DESIGN.md §5/§7.
  tls:
    enabled: false
    certfile: "data/tls/cert.pem"
    keyfile: "data/tls/key.pem"

# Per-user authentication (docs/AUTHENTICATION_DESIGN.md). Ships false; only
# the literal boolean true enables it (quoted "true" is OFF). When on, /auth/*
# serves sessions and per-device bearer tokens, and POST /query requires a
# session cookie or device token. When off, /query stays open and /auth/*
# returns 503.
#
# Auth+TLS bind route: a non-loopback api.host is allowed without
# CYCLAW_ALLOW_NON_LOOPBACK_BIND only when this flag and api.tls.enabled are
# both literally true, /query is verified at runtime to enforce a credential,
# security.api_key_optional is false, and the admin password is set. Read the
# design doc first.
#
# First enable with no accounts creates user "admin" with NO usable password
# (the hash of a random secret; the secret is discarded, never printed or
# logged). Set it on the server machine with `cyclaw-user passwd admin` (getpass, no echo) or the
# loopback Set-password panel on the terminal (:8787). Manage accounts with
# the same local-only CLI (add/role/list/disable/enable/passwd/token); see
# utils/authn_cli.py. No account exists until you turn this on.
auth:
  enabled: false
  # SQLite by default; relative paths anchor to the repo root. For Postgres,
  # set database_url or CYCLAW_AUTH_DB_URL (checked in that order). That env var
  # is deliberately separate from the personality DB's CYCLAW_DB_URL; see
  # utils/authn_store.py.
  db_path: "data/auth/cyclaw_auth.db"
  # database_url: null
  session:
    # A session ends at whichever limit comes first: idle_timeout_sec (12h,
    # reset on every valid use) or absolute_timeout_sec (7d, never reset).
    # Decision record: docs/AUTHENTICATION_DESIGN.md §10.2.
    idle_timeout_sec: 43200
    absolute_timeout_sec: 604800

logging:
  # Level for CyClaw's own loggers (cyclaw.*). Their DEBUG lines on the request
  # path log counts, budget arithmetic and exception types or tracebacks, never
  # query text, prompts or answers. The SHA-256-only audit stream (audit_file)
  # is separate and unaffected.
  # text, prompts or answers. The SHA-256-only audit stream (audit_file) is
  # separate and unaffected.
  level: "DEBUG"
  log_file: "logs/cyclaw.log"
  # Also write loggers outside cyclaw.* (httpx, chromadb, uvicorn, langgraph)
  # to log_file, at third_party_level.
  capture_third_party: true
  # Security floor, deliberately above DEBUG: httpcore DEBUG output includes
  # the Authorization header of every Grok/Claude/Ollama call, so DEBUG here
  # writes live API keys to log_file. Raise it only for a scoped debugging
  # session, and treat the resulting file as secret.
  third_party_level: "INFO"
  # log_file and the gateway's console are each written by one writer thread,
  # so a stalled disk cannot hold a thread that logs (an agentic CLI's console
  # stays synchronous). Past max_queued_records waiting lines, new ones are
  # dropped and counted: the first drop of each backlog is noted on stderr, the
  # count logged once the writer catches up.
  # once the writer catches up. At exit, each wait (queued lines, writer
  # finish, drop note) lasts at most drain_wait_sec. max_queued_records: whole
  # number >= 1; drain_wait_sec: positive, finite seconds, at most Python's
  # threading.TIMEOUT_MAX. Boot refuses others. audit_file is still written on
  # the caller's thread: it is the authoritative audit stream (I4).
  max_queued_records: 10000
  drain_wait_sec: 2.0
  audit_file: "logs/audit.jsonl"
  spend_file: "logs/spend.jsonl"
  # Read by metrics.py (eval trend). tests/judge_eval.py writes it at a fixed
  # path, so this must stay equal to that script's RUNS_PATH.
  eval_runs_file: "logs/evals/eval_runs.jsonl"
  # Only include_query_hash is read; the other audit fields are always written.
  # false stores raw query text (PII-redacted) in audit_file, and in the Numbat
  # stream's content_preview when it fits: a privacy regression. model_used
  # holds the answer ROLE ("local"/"grok"/"claude"/"offline-best-effort"),
  # llm_model the concrete tag, llm a summary.
  # privacy regression. model_used holds the answer ROLE ("local"/"grok"/
  # "claude"/"offline-best-effort"), llm_model the concrete tag, llm a summary.
  # model_used's vocabulary is frozen: metrics.py buckets on it and detects
  # online escalation from its prefix.
  audit_fields:
    include_query_hash: true

# Numbat derived event stream (issues #959/#961; switch scope: #1458).
# numbat.enabled turns on ONE thing: this derived NDJSON file. It is not Numbat
# enforcement and arms no policy. The other pieces have their own switches:
#   * pre-action hook before Grok/Claude -> policy.fallback.pre_action_hook
#     (enabled: false); its engine: numbat runs the Numbat CLI on each
#     proposed call and never reads this file
#   * CEL monitor rules on /query -> numbat.cel below (false; monitor-only)
#   * scoring by the Numbat CLI -> CI only (.github/workflows/numbat-rules.yml)
# Every write is fail-soft: a failure becomes a logger.warning, never an error
# to the caller. On /query the mainline copy is written inside audit_log, after
# the answer is computed. audit.jsonl stays authoritative. Schema 0.3.0, the
# one the CI-pinned Numbat 0.2.0 CLI reads.
# answer is computed, and fail-soft: a failure becomes a logger.warning, never
# an error to the caller. audit.jsonl stays authoritative. Schema 0.3.0, the
# Producers: the action plane (agentic, ops_runner, pre-action hook verdicts,
# CEL matches) and the mainline plane (every redacted audit record,
# artifact_type "cyclaw_audit_jsonl"). enabled: false stops all of them.
# action plane (agentic, ops_runner) and the mainline plane (every redacted
# audit record, artifact_type "cyclaw_audit_jsonl"). enabled: false stops both.
numbat:
  enabled: true             # true/false only; boot refuses "false"/"off" or a non-mapping block
  output_path: "logs/numbat-events.ndjsonl"
  # Rollover size in bytes: at or past it the file is renamed to <output_path>.1
  # (replacing any old .1) and a fresh file starts. 0 disables, and the file
  # then grows without bound. A failed rename keeps appending, never drops.
  max_bytes: 52428800       # 50 MiB
  # One writer thread does every append. A caller waits up to write_wait_sec
  # for its event; after a write overruns that, callers stop waiting until one
  # completes. Past max_queued_writes queued events, new ones are dropped and
  # counted in a warning logged at most once per drop_log_interval_sec. At exit
  # the process waits up to drain_wait_sec for the queue, and again for a stuck
  # write. *_sec: positive, finite, at most threading.TIMEOUT_MAX;
  # max_queued_writes: whole number >= 1. Boot refuses others.
  write_wait_sec: 1.0
  max_queued_writes: 1000
  drop_log_interval_sec: 60
  drain_wait_sec: 2.0
  source_agent: "unknown"   # "cyclaw" is not a legal Numbat enum
  source_type: "hook"
  # CEL monitor (issue #1128). Rules read query_hash, top_score, answer_model,
  # guardrail_blocked, guardrail_rails, model_provider and source_hashes, and
  # emit a low-confidence event on match. They never block /query; the regex
  # banned_patterns stay the fail-closed baseline. When disabled, cel-python is
  # not imported. Enabling needs: pip install -e ".[numbat-cel]" -c constraints.txt
  # A match is a tool.result, tool_name "cel_monitor", decision "allowed",
  # tagged "rules:<indices>"; content_preview carries the query_hash (join key
  # to rag_query) when include_query_hash is on. answer_model is the ROLE:
  # local, offline-best-effort, grok, claude, hook-denied, guardrail-blocked,
  # external-unavailable, or "" (the confirm pause). model_provider is "" when
  # no model ran. Two vetted samples (tests/test_numbat_cel.py runs them): the
  # first flags an online escalation on a near-total vault miss, the second any
  # request a control refused.
  #   rules:
  #     - 'answer_model in ["grok", "claude"] && top_score < 0.05'
  #     - 'answer_model == "hook-denied" || guardrail_blocked'
  cel:
    enabled: false          # true/false only; boot refuses a quoted "true"
    rules: []               # list of CEL expression strings
    max_rule_ms: 20         # per-rule budget; log warning if exceeded

security:
  # Decorative: no code reads require_env. The server boots without
  # GROK_API_KEY; Grok then reports unavailable.
  require_env:
    - "GROK_API_KEY"
  # Opt-out from the CYCLAW_API_KEY Bearer gate (gate.py require_api_key) on
  # its 18 routes: soul/*, ops/*, memory/*, audit/summary, query/export/html.
  # It does not touch /auth/*, which auth.enabled governs. Only a YAML boolean
  # true enables it (a quoted "true" fails closed). False: an unset
  # CYCLAW_API_KEY fails closed; a wrong key 401s.
  #
  # When true, a request skips the key ONLY if all three hold:
  #   (a) its socket peer is loopback;
  #   (b) it carries no forwarding header (X-Forwarded-For/-Host/-Proto,
  #       X-Real-IP, Forwarded), since a proxy on this host connects from
  #       127.0.0.1. Header presence is the signal; the value is never parsed;
  #   (c) it is not cross-site (Origin / Sec-Fetch-Site), since a page the
  #       operator visits is a loopback peer too.
  # A proxy that strips those headers looks like no proxy: do not enable this
  # on a host where anything fronts CyClaw.
  #
  # The check is keyed on the socket peer, never the Host header.
  # allowed_hosts / allowed_origins open no socket and cannot widen it
  # (config-guard C13 ignores them). Defence in depth: gate.py's main()
  # refuses a non-loopback api.host while this is true, even via the auth+TLS
  # route (only CYCLAW_ALLOW_NON_LOOPBACK_BIND overrides it), and C13 warns on
  # that pair. `uvicorn gate:app` (the
  # container CMD) skips main(), so the per-request check is the real control.
  #
  # Docker: inert. NAT makes the peer the bridge gateway, so the routes stay
  # key-gated. Set CYCLAW_API_KEY in the container (docker-compose.yml sets none).
  api_key_optional: false
  # A request whose declared Content-Length exceeds this gets 413 before the body
  # is buffered. Pydantic's per-field caps (largest 65536 chars, schemas/api.py)
  # apply only after Starlette buffers the whole body. 1 MiB covers the largest
  # real payload. A missing or false Content-Length (e.g. chunked) is not
  # checked: an accepted gap under docs/THREAT_MODEL.md.
  max_request_body_bytes: 1048576
  allowed_origins:
    # CORS allow-list. Every entry needs an explicit port: a portless row means
    # :80/:443, a different origin from the console on :8787 (#1298 N9).
    - "http://127.0.0.1:8787"  # DevSkim: ignore DS162092,DS137138
    - "http://localhost:8787"  # DevSkim: ignore DS162092,DS137138
    # Add LAN or https consoles the same way: scheme, host and port.
    # Never list "null": starlette matches it literally, so it would grant CORS
    # reads to every opaque origin (file://, sandboxed iframes, data:/blob:). curl and
    # MCP clients send no Origin and need no entry.

  # TrustedHostMiddleware allow-list (DNS-rebinding defense): a request whose
  # Host is not listed gets HTTP 400 before any handler. Port is ignored. The
  # same-origin check also requires the Origin's host to be listed here.
  allowed_hosts:
    - "127.0.0.1"  # DevSkim: ignore DS162092,DS137138 - loopback host by design
    - "localhost"  # DevSkim: ignore DS162092,DS137138 - loopback host by design
    - "10.0.0.112"  # DevSkim: ignore DS137138 - home-lab LAN host
    - "10.0.0.111"  # DevSkim: ignore DS137138 - home-lab LAN host
    # The LAN IPs are a lab workaround; do not ship them without full auth/MFA.
# === sync: Dropbox corpus sync (out-of-band, rclone) ===
# Runs only via `python -m sync.cli`; never imported by gate.py, graph.py or
# the MCP server. Without this block the CLI exits with a config error. The
# Dropbox refresh token lives only in rclone.conf, never here.
sync:
  enabled: false                 # `sync.cli sync` no-ops (exit 0) while false; a missing key means on
  local_path: "data/corpus"      # validated: absolute, under repo data/corpus, a dir
  remote_name: "dropbox_cyclaw"  # must match `rclone listremotes`
  remote_path: "CyClaw/corpus"   # folder inside the Dropbox App Folder
  direction: "pull"              # "pull" (safe default) | "bisync" (opt-in, discouraged)
  include_soul: false            # deprecated no-op: the soul is never mirrored
  reindex_on_change: true        # exit 10 when data/corpus/** changed
  auto_reindex: false            # with reindex_on_change, run the indexer instead of exiting 10
  checksum: true                 # rclone --checksum (hash compare, not mtime)
  max_delete: 20                 # bisync fuse: abort if > N deletions (pull never deletes)
  max_transfer: "1G"             # fuse: rclone stops once this much has transferred
  sync_timeout_sec: 3600         # one wall-clock cap on all rclone attempts, retries and check (a hang holds the run lock); 0 = unbounded
  sync_retries: 0                # outer retries on a transient rclone failure (exit 5); 0 = single-shot
  retry_backoff_sec: 5.0         # base for exponential backoff between retries
  fast_list: false               # rclone --fast-list: one bulk listing (faster, more memory)
  # bwlimit: "8M"                # optional rclone --bwlimit ("8M", "512k", "off"); unset = no limit
  schedule_hour: 2               # 24h local time (cron/timer/Task Scheduler)
  schedule_min: 0
  scheduler_backend: "cron"      # "cron" (portable) | "launchd" (Darwin only)
  schedule_frequency: "daily"    # "daily" | "weekly" | "monthly"
  schedule_weekday: 1            # 0-7 (0/7=Sunday); "weekly" only
  schedule_day: 1                # 1-31; "monthly" only
  conflict_resolve: "newer"      # bisync-only: newer modtime wins
  conflict_loser: "rename"       # bisync-only: loser saved as .conflict1 (never deleted)
  # extra_excludes:              # optional, appended AFTER hardened block
  #   - "scratch/**"

# === Agentic layer (out-of-band, experimental v0.1) ===
# Runs only via `python -m agentic.cli`; never imported by gate.py, graph.py
# or the MCP server. enabled: false (or no enabled key) makes the CLI no-op;
# a missing block is a config error. Reads use the `gh` CLI (argv list, no
# shell, no token forwarded by CyClaw). The GitHub write path is armed in
# code (agentic/writer.py EXECUTION_ENABLED=True) and by mode/writes_enabled
# below; each write still needs a reason and confirm. Full gate chain:
# docs/agentic/GITHUB_WRITE_ENABLEMENT.md.
agentic:
  enabled: false                 # off by default; CLI no-ops (exit 0) while false
  repo: "cgfixit/CyClaw"         # validated: owner/name, no shell metacharacters
  mode: "write"                  # "read" | "write" (armed; still needs enabled + reason + confirm)
  writes_enabled: true           # second flag; writes need mode=write AND this AND reason AND confirm
  gh_min_version: "2.40.0"       # `gh` version floor (X.Y.Z)
  gh_timeout_sec: 30             # wall-clock ceiling per gh read subprocess
  gh_retries: 2                  # extra attempts on a transient gh failure (timeout/5xx/429); others fail fast
  registry_path: "data/agentic/skills_registry.json"  # validated: under repo data/ tree
  allowed_read_ops:              # only these read ops may run
    - pr_view
    - pr_list
    - pr_diff
    - issue_view
    - issue_list
    - repo_view
  # Real-repo coding pipeline (`real-repo-run`, agentic/real_repo_loop.py) plus the
  # retired DeepAgents graph. Never imported by the core request path (I6).
  # allow_deepagents_dependency and the allow_filesystem/shell/github flags govern
  # only the retired graph; the real-repo pipeline reads every other key.
  deepagent_github:
    enabled: false
    provider: "ollama"                          # "ollama" | "openai_compatible"
    base_url: "http://127.0.0.1:11434/v1"        # DevSkim: ignore DS162092,DS137138 - local Ollama; config load refuses a non-loopback URL
    model: "qwen3.8:27b-mlx"
    # Per-call HTTP timeout for the planner's model call (local and cloud clients).
    # Separate from models.local_llm.timeout_sec because this package cannot import
    # the core (I6); its prompts are comparably large.
    planner_timeout_sec: 720
    # Reserved completion tokens per plan/coding call. Keep prompt + this budget
    # below Ollama num_ctx; raise only after measuring.
    planner_max_tokens: 3072
    allow_deepagents_dependency: false           # extras must be installed explicitly
    # Retired DeepAgents tool surface only. Real-repo file writes gate on
    # allow_git_write_tools, not this flag.
    allow_filesystem_write_tools: false
    allow_shell_execution: false                 # no generic shell tool; true is refused (not implemented)
    allow_github_writes: false                   # true is refused; agentic/writer.py owns GitHub writes
    # Gates write_file and git checkout -b/add/commit/diff/push in a clone this
    # layer made under workspace_root. push_branch reaches the real origin remote
    # when armed; PR calls stay with agentic/writer.py. Separate from allow_shell_execution.
    allow_git_write_tools: false
    # A candidate that writes any of these is refused: they judge its own
    # acceptance, so rewriting them would pass its checks by construction.
    # An entry ending in "/" matches that directory; a bare filename matches at
    # any depth.
    protected_write_paths:
      - "tests/"
      - "conftest.py"
      - ".github/"
      - ".git/"
      - "pyproject.toml"
      - "setup.cfg"
      - "pytest.ini"
      # ruff config files override [tool.ruff] in pyproject.toml; tox.ini and
      # noxfile.py can redefine how a declared check runs.
      - ".ruff.toml"
      - "ruff.toml"
      - "tox.ini"
      - "noxfile.py"
      - ".claude/"
      - ".codex/"
      # config.yaml holds the safety tunables that config-validating checks read;
      # CLAUDE.md holds the rules this loop runs under.
      - "config.yaml"
      - "CLAUDE.md"
    max_write_budget_bytes: 100000               # total bytes ONE iteration may write; not per-file
    # Blocks proposed content shaped like exfiltration, a reverse shell, obfuscated
    # exec or a pipe-to-shell install; the prompt-injection scan misses these. A
    # heuristic (see agentic/harness_optimizer/governance.py::inspect_code_shape).
    # Set false only if it blocks a legitimate change; human diff review at
    # pending_decision is the real gate either way.
    scan_code_shape: true
    # Length cap for cloud-provider prompts (sanitize_handoff); a longer prompt is
    # refused, not truncated. Larger than policy.prompt_filter.max_input_chars (4000)
    # because a real-repo prompt bundles read files and PR/issue diffs.
    max_handoff_chars: 200000
    workspace_root: "data/agentic/workspaces"    # validated: under repo data/ tree
    # Gate 3 of six for cloud coding-loop providers: agentic.enabled,
    # deepagent_github.enabled, allow_cloud_providers, providers.<name>.enabled,
    # the provider's API key env var, and a per-run --confirm-online.
    # A provider enabled while this is false is a config error (agentic config load fails).
    allow_cloud_providers: true
    providers:
      grok:
        enabled: true
        model: "grok-4.5"                        # cite models.grok.model; re-verify at enable time
      claude:
        enabled: true
        model: "claude-sonnet-5"                 # cite models.claude.model; same drift warning
  # Governed harness optimizer. Applying a candidate only records a versioned local
  # artifact, after the deterministic gates and a human reason/confirmation; it
  # never mutates source, soul.md or GitHub.
  harness_optimizer:
    enabled: false
    max_iterations: 3
    require_human_confirm_for_accept: true
    output_dir: "data/agentic/harness_optimizer/runs"
    memory_dir: "data/agentic/harness_optimizer/memory"
    allow_local_model_judge: false

# === Filesystem connector (out-of-band) [v0.1 — experimental] ===
# Absent or enabled: false disables it. Runs only via `python -m agentic.fsconnect.cli`;
# never imported by gate.py, graph.py or the MCP server. Reads are scoped to
# allowed_roots. Writes go only to writable_roots, are off by default, and need
# writes_enabled + a human reason (+ confirm for destructive ops). It never calls an
# LLM; write content comes from --body/--body-file/stdin.
fsconnect:
  enabled: false                 # CLI no-ops (exit 0) while false
  # --- READ scope ---
  allowed_roots: []              # REQUIRED when enabled; each must resolve to an existing dir
  allowed_fs_ops:                # read ops to allow
    - fs_list
    - fs_stat
    - fs_read
    - fs_grep
    - fs_glob
    - fs_largest
  allow_unc_roots: false         # UNC \\server\share roots (egress risk); refused unless true
  allow_macos_volume_roots: false  # /Volumes network/removable roots; refused unless true
  max_file_bytes: 5242880        # 5 MiB read cap, checked with fstat on the open handle
  largest_max_entries: 100000    # max entries one fs_largest walk inspects
  follow_symlinks: false         # must be false (true fails at load); any symlink/reparse point under a root is denied
  scan_content: true             # advisory OWASP + banned_patterns flags on read, write and index content
  # --- WRITE scope (separate list, default off) ---
  writes_enabled: false          # false => write ops return DRY-RUN plans; on Windows every write op is refused
  writable_roots:                # the only paths writes may touch; created if missing
    - null                       # null => C:\CyClaw-FS (Win) | ~/CyClaw-FS (macOS) | /var/lib/cyclaw-fs (Linux, home fallback)
  max_write_bytes: 10485760      # 10 MiB write cap
  require_confirm_destructive: true   # overwrite/move/delete need --confirm (every write needs --reason)
  # --- optional write hardening (safe to omit) ---
  strict_roots: false            # true => fail closed if a writable root can't be prepared (no ~/CyClaw-FS fallback)
  block_on_injection_flags: false  # true => refuse a write the advisory scan flags (needs scan_content: true)
  allow_hard_delete: false       # required for `delete --purge` (bypasses trash); global, not per-root
  trash_retention_days: 30       # deletes go to <root>/.cyclaw-trash; purgeable after this many days
  quota_recompute_hours: 24      # an older quota ledger is fully recomputed before enforcing
  write_rate_limit:              # per-root (fs:<root>) + global (fs:*) write throttle
    enabled: false
    max_ops: 30                  # per-root ops per window
    window_seconds: 60           # sliding window
    # global_max_ops: 60         # cap across all roots (default 2 x max_ops)
    db_path: "data/fsconnect_rate.db"  # separate from the gateway limiter's db
  # A writable_roots entry may be a mapping with a per-root quota (null/absent => unlimited):
  #   - path: /var/lib/cyclaw-fs
  #     quota_bytes: 1073741824  # 1 GiB
  #     max_files: 10000
  # --- RAG indexing of the file share ---
  index_enabled: false
  index_root: null               # null => the first writable_root
  index_extensions:
    - ".md"
    - ".txt"
    - ".pdf"
    - ".docx"
    - ".csv"
  index_max_file_bytes: 10485760
  index_incremental: false       # true => skip files unchanged (size+mtime) since the last run

# ===========================
# SQL connector (out-of-band, READ-ONLY)  [v0.1 — disabled scaffold]
# ===========================
# Read-only Postgres / MSSQL, run only via `python -m agentic.sqlconnect.cli`.
# enabled: false => CLI no-op; a missing block is a config error (exit 3). Neither touches the gateway.
sqlconnect:
  enabled: false
  driver: "postgres"             # "postgres" | "mssql"
  dsn_env: "CYCLAW_SQL_DSN"      # DSN comes from this env var only, never YAML
  allowed_sql_ops:               # read ops to allow
    - schema_list
    - table_preview
    - run_select                 # one SELECT/WITH statement only
    - explain                    # query plan for a SELECT/WITH (Postgres only)
    - row_count                  # count(*) without fetching rows
  read_only: true                # must be true; a driver that can't open a read-only session is refused
  statement_timeout_ms: 5000     # MSSQL uses whole seconds (min 1)
  max_rows: 1000
  allow_write: false             # must be false; v0.1 cannot write

# === Passive LAN inventory connector (out-of-band) [v0.1] ===
# Reads local host metadata and the OS's existing neighbor cache only: no ping,
# port probe, subnet sweep, packet send, scheduler or API route. Every returned
# address must fall inside allowed_cidrs.
netconnect:
  enabled: false
  allowed_cidrs: []              # REQUIRED when enabled; IPv4 RFC1918/loopback only (others fail at load), e.g. ["192.168.1.0/24"]
  allowed_net_ops:
    - self
    - arp
  command_timeout_sec: 5         # (0, 30]
  max_neighbors: 512             # 1..4096

# === NeMo Guardrails (out-of-band content-safety layer) [default off] ===
# Opt-in defense in depth; graph edges stay the sole source of routing. Reached
# only through utils/guardrail_bridge.py; gate.py, graph.py and mcp_hybrid_server.py
# never import this package. CLI: `python -m guardrails.cli`. nemoguardrails is
# optional: without it the offline heuristic rails run, and a skipped check() is
# audited as guardrail_degraded. See docs/NeMo/README.md.
guardrails:
  enabled: false                 # false = pure pass-through on /query. true arms:
                                  # - guardrail_input: injection markers + soul-mutation
                                  #   regex, no LLM, before local_llm and offline_best_effort;
                                  # - guardrail_output: grounding + soul leak, local_llm answer only;
                                  # - with nemoguardrails installed, NeMo check() around every
                                  #   /query model call incl. Grok and Claude. Its flows
                                  #   (guardrails/config/config.yml) run the same Python checks.
  engine: "openai"               # Ollama exposes an OpenAI-compatible API
  base_url: "http://127.0.0.1:11434/v1"  # DevSkim: ignore DS162092,DS137138 - loopback Ollama, offline-only
  model: "qwen3.8:27b-mlx"           # keep in sync with models.local_llm.model
  nemo_config_dir: "guardrails/config"  # holds config.yml + rails.co
  metrics_path: "logs/guardrails.jsonl" # separate from the audit log; hashes only
  block_message: "I can't help with that request. It was stopped by a CyClaw safety guardrail."
  hallucination_threshold: 0.18  # [0..1] token-overlap floor; answers below it are flagged ungrounded
  input_rails:                   # offline rails guardrail_input runs (NeMo flows are fixed by config.yml)
    - check_injection
    - check_jailbreak            # NOT a rail of its own; no layer has a jailbreak classifier.
                                # Offline it does nothing; the NeMo flow re-runs the
                                # check_injection markers ("you are now ..."). Other persona
                                # prompts pass; banned_patterns is the front door for those.
    - check_soul_mutation
  output_rails:                  # offline rails guardrail_output runs (NeMo flows: config.yml)
    - check_grounding
    - check_soul_leak           # offline floor (detect_soul_leak) on local_llm answers only;
                                # with NeMo installed, the "check soul leak" flow also covers
                                # the external and offline_best_effort answers.
  topical_rails:                 # display-only (CLI status); nothing enforces them
    - stay_in_local_knowledge
    - no_unauthed_external_advice
  soul_topics:                   # substring keywords counted as soul-topic turns in metrics; never block
    - soul
    - personality
    - identity
    - who are you
    - your name
    - your purpose
    - system prompt
    - your instructions
    - persona
    - short-term memory

# === UNSLOP: offline prose-quality rail for agentic/real_repo_loop.py (default off) ===
# Flags AI-writing tells in local-model output. Log-only: findings are appended to
# rejection feedback and never change acceptance. No network; scanners are vendored
# under agentic/vendor/unslop/.
unslop:
  enabled: false
  metrics_path: "logs/unslop.jsonl"

# === Telegram channel (out-of-band) [v0.1; default off] ===
# Runs only via `python -m telegram.cli`; gate.py, graph.py and mcp_hybrid_server.py
# never import it. Chat answers go only through loopback POST /query, so I1–I5 hold.
# The bot token comes from a no-echo CLI prompt or bot_token_env, never YAML.
# Design: docs/channels/TELEGRAM_DESIGN.md. Threat model: docs/THREAT_MODEL.md §5 seventh amendment.
telegram:
  enabled: false                 # needs allowed_chat_ids; while false CLI status/test work, send/poll no-op or refuse
  mode: "chat"                 # "notify" (outbound only) | "chat" (2-way long-poll)
  bot_token_env: "TELEGRAM_BOT_TOKEN"  # unattended token source
  allowed_chat_ids: []           # REQUIRED non-empty when enabled: true (load fails if empty)
  # To enable: set mode "notify" first and list your real numeric chat id. Entries
  # must be signed integers (other strings fail at load); a made-up number loads but
  # never matches, so the channel looks armed while refusing every message. Leave
  # allow_hybrid_confirm and media.enabled false unless you have read their sections.
  api_base: "https://api.telegram.org"
  poll_timeout_sec: 30           # getUpdates long-poll window (mode=chat)
  max_message_chars: 4000        # max 4096; align with policy.prompt_filter.max_input_chars
  allow_hybrid_confirm: false    # T3 switch; only the exact `/online on <grok|claude>` command
  hybrid_confirm_ttl_sec: 120    # one-request consent lifetime; max 300
  rate_limit:                    # enforced on outbound sends and inbound updates
    max_ops: 20
    window_seconds: 60
  query:
    base_url: "http://127.0.0.1:8787"  # DevSkim: ignore DS162092,DS137138 - loopback CyClaw only
    api_key_env: "CYCLAW_API_KEY"
    timeout_sec: 790             # api.graph_timeout_sec + 10, so the server's 504 GRAPH_TIMEOUT arrives before a client abort
  media:                         # also needs fsconnect enabled, writes_enabled, strict_roots, scan_content,
                                  # block_on_injection_flags and write_rate_limit.enabled all true
    enabled: false               # T4; accepts only private-chat `/save --confirm <reason>` attachments
    fsconnect_root: ""           # REQUIRED when enabled; absolute, an exact fsconnect.writable_roots entry outside the repo, corpus and read roots
    max_download_bytes: 10485760 # also capped by fsconnect.max_write_bytes and the Bot API's 20 MiB limit

# === OpenTweet X channel (out-of-band) [v0.1; default off] ===
# Runs only via `python -m opentweet.cli`; never imported by gate.py, graph.py or
# mcp_hybrid_server.py. Generation uses loopback POST /query with
# user_confirmed_online always false. The default write is an OpenTweet draft.
# The ot_ key comes from api_key_env, never YAML. Design: docs/channels/OPENTWEET_DESIGN.md
opentweet:
  enabled: false
  api_base: "https://opentweet.io"
  api_key_env: "OPENTWEET_API_KEY"
  topic_file: ""                 # REQUIRED non-empty when enabled: true
  max_topic_chars: 500
  max_post_chars: 280
  schedule_enabled: false        # true => set OpenTweet scheduled_date (else draft only)
  schedule_slot: "09:00"         # local HH:MM when schedule_enabled
  weekday: 1                     # weekly job: 1 Monday, 0 or 7 Sunday (launchd + schtasks)
  fire_hour: 6                   # weekly job local time (with fire_minute)
  fire_minute: 0
  query:
    base_url: "http://127.0.0.1:8787"  # DevSkim: ignore DS162092,DS137138 - loopback CyClaw only
    api_key_env: "CYCLAW_API_KEY"
    timeout_sec: 790             # api.graph_timeout_sec + 10, as for telegram.query.timeout_sec

# === Evaluation plane (out-of-band) [judge: Anthropic by default; local opt-in] ===
# tests/judge_eval.py scores models.local_llm on the groundedness fixture.
# CYCLAW_EVAL_LIVE=1 gates every run; never a graph node or required CI. With
# local_judge enabled, a second model on models.local_llm.base_url grades instead,
# with no cloud key or egress. Check a judge against tests/judge_calibrate.py
# before trusting its trend.
evals:
  local_judge:
    enabled: false
    model: ""                    # REQUIRED when enabled; must differ from models.local_llm.model (self-grading inflates scores); prefer another family, e.g. "gemma3:12b"
